<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Godot-style 3D Asset Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: #16161a; color: #dcdce2; overflow: hidden; }
    
    /* Файловый менеджер (слева) */
    #sidebar { width: 300px; background: #1b1b22; border-right: 1px solid #282832; display: flex; flex-direction: column; flex-shrink: 0; }
    .panel-header { padding: 12px 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #282832; background: #131317; color: #8e8ea0; }
    #dropzone { margin: 12px; padding: 20px; border: 2px dashed #343444; border-radius: 8px; text-align: center; cursor: pointer; font-size: 12px; color: #7f7f98; transition: all .2s; }
    #dropzone:hover, #dropzone.dragover { border-color: #4a72ff; color: #fff; background: rgba(74, 114, 255, 0.05); }
    #assets-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .sec-title { font-size: 11px; text-transform: uppercase; color: #62627a; margin: 14px 0 6px; font-weight: 700; }
    .asset-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #22222c; margin-bottom: 5px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
    .asset-item:hover { background: #2b2b38; }
    .asset-item.selected { border-color: #4a72ff; background: #23293e; }
    .asset-thumb { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: #121216; flex-shrink: 0; }
    .btn-dl { margin-left: auto; background: none; border: none; color: #888; cursor: pointer; padding: 4px; border-radius: 4px; }
    .btn-dl:hover { color: #fff; background: #333; }

    /* 3D Вьюпорт (центр) */
    #viewport-container { flex: 1; position: relative; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #status { position: absolute; bottom: 12px; left: 12px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #2e2e3e; }
    #view-tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; }
    .tool-btn { background: rgba(27, 27, 34, 0.8); border: 1px solid #343444; color: #ccc; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .tool-btn:hover { background: #2b2b38; color: #fff; }

    /* Инспектор свойств (справа) */
    #inspector { width: 280px; background: #1b1b22; border-left: 1px solid #282832; display: flex; flex-direction: column; flex-shrink: 0; }
    #inspector-content { padding: 16px; overflow-y: auto; flex: 1; }
    .prop-row { margin-bottom: 12px; }
    .prop-row label { display: flex; justify-content: space-between; font-size: 11px; color: #8e8ea0; margin-bottom: 4px; }
    .prop-row input[type="range"] { width: 100%; accent-color: #4a72ff; cursor: pointer; }
    .prop-row input[type="color"] { width: 100%; height: 28px; border: none; border-radius: 4px; background: none; cursor: pointer; }
    
    /* Слоты под текстуры в инспекторе */
    .slot-box { border: 1px dashed #3a3a4c; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #17171e; display: flex; align-items: center; gap: 8px; }
    .slot-box.dragover { border-color: #4a72ff; background: rgba(74, 114, 255, 0.1); }
    .slot-thumb { width: 28px; height: 28px; background: #222; border-radius: 4px; object-fit: cover; }
    .slot-name { font-size: 11px; color: #aaa; flex: 1; }
    .empty-state { color: #555; text-align: center; margin-top: 50px; font-size: 12px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Файловый менеджер -->
  <div id="sidebar">
    <div class="panel-header">Файловая система</div>
    <div id="dropzone">Загрузить .glb файл<input type="file" id="file-input" accept=".glb,.gltf" style="display:none"></div>
    <div id="assets-list">
      <div class="sec-title">Модель / Префаб</div>
      <div id="models-container"></div>
      
      <div class="sec-title">Материалы (Слои)</div>
      <div id="materials-container"></div>
      
      <div class="sec-title">Извлеченные текстуры</div>
      <div id="textures-container"></div>
    </div>
  </div>

  <!-- 3D Viewport -->
  <div id="viewport-container">
    <canvas id="canvas3d"></canvas>
    <div id="view-tools">
      <button class="tool-btn" id="btn-reset-cam">Сброс камеры</button>
      <button class="tool-btn" id="btn-toggle-grid">Сетка</button>
    </div>
    <div id="status">Перетащите 3D-модель для начала</div>
  </div>

  <!-- Инспектор материала -->
  <div id="inspector">
    <div class="panel-header">Инспектор материала</div>
    <div id="inspector-content">
      <div class="empty-state">Выберите материал слева для настройки</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Сцена и Вьюпорт
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181f);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 3);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;

    const grid = new THREE.GridHelper(10, 10, 0x3e3e50, 0x242430);
    scene.add(grid);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    let currentModel = null;
    let selectedMaterial = null;
    const extractedTextures = [];

    // 2. Drag and Drop импорт GLB
    const loader = new GLTFLoader();
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('status');

    dropzone.onclick = () => fileInput.click();
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
    dropzone.ondragleave = () => dropzone.classList.remove('dragover');
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) loadGLB(e.dataTransfer.files[0]);
    };
    fileInput.onchange = (e) => { if (e.target.files[0]) loadGLB(e.target.files[0]); };

    function loadGLB(file) {
      status.innerText = `Парсинг ${file.name}...`;
      const reader = new FileReader();
      reader.onload = (e) => {
        loader.parse(e.target.result, '', (gltf) => {
          if (currentModel) scene.remove(currentModel);
          currentModel = gltf.scene;
          scene.add(currentModel);

          // Центрируем модель
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          currentModel.position.sub(center);

          decomposeModel(file.name, currentModel);
          status.innerText = `Готово: ${file.name}`;
        }, (err) => {
          console.error(err);
          status.innerText = 'Ошибка при парсинге GLB';
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // 3. Декомпозиция: сбор материалов и текстур
    function decomposeModel(fileName, model) {
      const modelsBox = document.getElementById('models-container');
      const matsBox = document.getElementById('materials-container');
      const texBox = document.getElementById('textures-container');
      
      modelsBox.innerHTML = ''; matsBox.innerHTML = ''; texBox.innerHTML = '';
      extractedTextures.length = 0;

      modelsBox.innerHTML = `<div class="asset-item selected">📦 ${fileName}</div>`;

      const foundMaterials = new Set();
      let matIndex = 0;

      model.traverse((child) => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((mat) => {
            if (!foundMaterials.has(mat)) {
              foundMaterials.add(mat);
              const mId = matIndex++;
              
              // Элемент списка материалов
              const matEl = document.createElement('div');
              matEl.className = 'asset-item';
              matEl.innerHTML = `🎨 <strong>Surface ${mId}:</strong> ${mat.name || 'Material_' + mId}`;
              matEl.onclick = () => selectMaterial(mat, matEl);
              matsBox.appendChild(matEl);

              if (mId === 0) selectMaterial(mat, matEl); // Выбираем первый по умолчанию

              // Поиск и извлечение текстур
              ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((slot) => {
                const tex = mat[slot];
                if (tex && tex.image && !extractedTextures.some(t => t.texture === tex)) {
                  try {
                    const canvasThumb = document.createElement('canvas');
                    canvasThumb.width = 64; canvasThumb.height = 64;
                    const ctx = canvasThumb.getContext('2d');
                    ctx.drawImage(tex.image, 0, 0, 64, 64);
                    const dataUrl = canvasThumb.toDataURL();

                    const texData = {
                      id: extractedTextures.length,
                      name: `${slot}_${mat.name || 'tex'}`,
                      dataUrl,
                      texture: tex
                    };
                    extractedTextures.push(texData);

                    // Рендерим текстуру в файл-менеджере
                    const texEl = document.createElement('div');
                    texEl.className = 'asset-item';
                    texEl.draggable = true;
                    texEl.innerHTML = `
                      <img class="asset-thumb" src="${dataUrl}">
                      <span>${texData.name}</span>
                      <button class="btn-dl" title="Скачать">💾</button>
                    `;
                    
                    // Drag and drop текстуры
                    texEl.ondragstart = (e) => {
                      e.dataTransfer.setData('text/plain', String(texData.id));
                    };

                    // Кнопка скачивания текстуры
                    texEl.querySelector('.btn-dl').onclick = (e) => {
                      e.stopPropagation();
                      const a = document.createElement('a');
                      a.href = dataUrl;
                      a.download = `${texData.name}.png`;
                      a.click();
                    };

                    texBox.appendChild(texEl);
                  } catch (e) {
                    console.warn(e);
                  }
                }
              });
            }
          });
        }
      });
    }

    // 4. Инспектор свойств материала
    function selectMaterial(mat, element) {
      selectedMaterial = mat;
      document.querySelectorAll('#materials-container .asset-item').forEach(el => el.classList.remove('selected'));
      if (element) element.classList.add('selected');

      const box = document.getElementById('inspector-content');
      const hexColor = '#' + (mat.color ? mat.color.getHexString() : 'ffffff');

      box.innerHTML = `
        <div style="font-weight:700;margin-bottom:14px;color:#fff;">${mat.name || 'Material'}</div>
        
        <div class="prop-row">
          <label>Цвет (Base Color) <span>${hexColor}</span></label>
          <input type="color" id="mat-color" value="${hexColor}">
        </div>

        <div class="prop-row">
          <label>Roughness (Шероховатость) <span id="val-rough">${mat.roughness ?? 0.5}</span></label>
          <input type="range" id="mat-rough" min="0" max="1" step="0.01" value="${mat.roughness ?? 0.5}">
        </div>

        <div class="prop-row">
          <label>Metalness (Металличность) <span id="val-metal">${mat.metalness ?? 0.0}</span></label>
          <input type="range" id="mat-metal" min="0" max="1" step="0.01" value="${mat.metalness ?? 0.0}">
        </div>

        <div class="sec-title" style="margin-top:16px;">Текстурные слоты (Drag & Drop сюда)</div>
        <div id="slots-area"></div>
      `;

      // Привязка инпутов
      document.getElementById('mat-color').oninput = (e) => { mat.color.set(e.target.value); };
      document.getElementById('mat-rough').oninput = (e) => {
        mat.roughness = parseFloat(e.target.value);
        document.getElementById('val-rough').innerText = mat.roughness;
      };
      document.getElementById('mat-metal').oninput = (e) => {
        mat.metalness = parseFloat(e.target.value);
        document.getElementById('val-metal').innerText = mat.metalness;
      };

      // Генерация слотов
      const slotsArea = document.getElementById('slots-area');
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((slotKey) => {
        const slotEl = document.createElement('div');
        slotEl.className = 'slot-box';
        const hasTex = mat[slotKey];
        const thumbSrc = hasTex && hasTex.image ? hasTex.image.src : '';

        slotEl.innerHTML = `
          <img class="slot-thumb" src="${thumbSrc}" style="${hasTex ? '' : 'display:none'}">
          <div class="slot-name">${slotKey}: ${hasTex ? 'Назначена' : 'Пусто'}</div>
        `;

        slotEl.ondragover = (e) => { e.preventDefault(); slotEl.classList.add('dragover'); };
        slotEl.ondragleave = () => slotEl.classList.remove('dragover');
        slotEl.ondrop = (e) => {
          e.preventDefault();
          slotEl.classList.remove('dragover');
          const texId = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const found = extractedTextures.find(t => t.id === texId);
          if (found) {
            mat[slotKey] = found.texture;
            mat.needsUpdate = true;
            selectMaterial(mat, element); // перерисовать инспектор
          }
        };

        slotsArea.appendChild(slotEl);
      });
    }

    // 5. Кнопки вьюпорта
    document.getElementById('btn-reset-cam').onclick = () => {
      camera.position.set(2.5, 2, 3);
      controls.target.set(0, 0, 0);
      controls.update();
    };
    document.getElementById('btn-toggle-grid').onclick = () => {
      grid.visible = !grid.visible;
    };

    // 6. Анимационный цикл
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    };
  </script>
</body>
</html>
