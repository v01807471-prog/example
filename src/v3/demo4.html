            if (!c) return;
            html += `<div class="insp-row" style="cursor:pointer" onclick="selectResById('${c.id}')">
        <span style="color:#666;width:20px">[${i}]</span>
        <span>${RES_ICON.animation_clip}</span> <span class="res-name" style="color:#a8c8e8">${c.name}</span>
        <span style="color:#666;margin-left:auto">${c.data.duration.toFixed(2)}s</span>
      </div>`;
          });
        } else if (res.type === "animation_clip") {
          const clip = res.data;
          html += `<div class="insp-row"><button class="tiny" onclick="switchTab('animation');renderAnimationEditor()">▶ Открыть в редакторе</button></div>`;
          html += `<div class="insp-row"><label>Duration</label><span>${clip.duration.toFixed(2)}s</span></div>`;
          html += `<div class="insp-row"><label>Tracks</label><span>${clip.tracks.length}</span></div>`;
        }
        return html;
      }

      function renderPrefabBody(res) {
        let html = `<div class="insp-note">Дважды кликните в Assets, чтобы открыть как сцену.</div>`;
        html += `<div class="insp-row"><button class="tiny" onclick="openScene('${res.id}')">📂 Открыть сцену</button></div>`;
        html += `<div class="insp-row"><button class="tiny" onclick="toggleJSON('${res.id}')">📄 JSON</button></div>`;
        if (window["_json_" + res.id]) {
          html += `<div class="json-view">${highlightJSON(JSON.stringify(serializePrefab(res), null, 2))}</div>`;
        }
        html += `<div class="insp-group">Nodes (${res.internalNodes?.length || 0})</div>`;
        if (res.internalNodes && res.internalNodes.length) {
          res.internalNodes.forEach((node, i) => {
            html += `<div class="insp-row" style="cursor:pointer" onclick="selectNodeById('${node.id}')"><span style="color:#666;width:20px">[${i}]</span><span>${NODE_ICON[node.type] || "·"}</span> <span class="res-name" style="color:#a8c8e8">${node.name}</span></div>`;
          });
        } else {
          html += `<div class="insp-note" style="color:#555;font-style:italic">Нет узлов</div>`;
        }
        html += `<div class="insp-group">Resources (${res.internalResources?.length || 0})</div>`;
        if (res.internalResources && res.internalResources.length) {
          res.internalResources.forEach((r, i) => {
            html += `<div class="insp-row" style="cursor:pointer" onclick="selectResById('${r.id}')"><span style="color:#666;width:20px">[${i}]</span><span>${RES_ICON[r.type]}</span> <span class="res-name" style="color:#a8c8e8">${r.name}</span></div>`;
          });
        } else {
          html += `<div class="insp-note" style="color:#555;font-style:italic">Нет ресурсов</div>`;
        }
        return html;
      }
      window.toggleJSON = function (resId) {
        if (window["_json_" + resId]) delete window["_json_" + resId];
        else window["_json_" + resId] = true;
        renderInspector();
      };
      function highlightJSON(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(
            /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
            (m) => {
              let cls = "json-number";
              if (/^"/.test(m)) cls = /:$/.test(m) ? "json-key" : "json-string";
              else if (/true|false/.test(m)) cls = "json-bool";
              return `<span class="${cls}">${m}</span>`;
            },
          );
      }

      /* ============ SERIALIZE ============ */
      function serializePrefab(res) {
        const resources = [];
        const seen = new Set();
        for (const r of res.internalResources) {
          if (seen.has(r.id)) continue;
          seen.add(r.id);
          if (r.type === "mesh") resources.push(serializeMesh(r));
          else if (r.type === "material") resources.push(serializeMaterial(r));
          else if (r.type === "texture") resources.push(serializeTexture(r));
          else if (r.type === "animation")
            resources.push(serializeAnimationRes(r));
          else if (r.type === "animation_clip")
            resources.push(serializeAnimationClip(r));
        }
        const nodes = [];
        function traverse(obj) {
          if (obj.isBone) return null;
          if (obj.userData.isSceneInstance) {
            const node = {
              type: "SceneInstance",
              name: obj.name || "SceneInstance",
            };
            if (
              obj.position.x !== 0 ||
              obj.position.y !== 0 ||
              obj.position.z !== 0
            )
              node.position = [
                +obj.position.x.toFixed(4),
                +obj.position.y.toFixed(4),
                +obj.position.z.toFixed(4),
              ];
            if (
              obj.rotation.x !== 0 ||
              obj.rotation.y !== 0 ||
              obj.rotation.z !== 0
            )
              node.rotation = [
                +obj.rotation.x.toFixed(4),
                +obj.rotation.y.toFixed(4),
                +obj.rotation.z.toFixed(4),
              ];
            if (obj.scale.x !== 1 || obj.scale.y !== 1 || obj.scale.z !== 1)
              node.scale = [
                +obj.scale.x.toFixed(4),
                +obj.scale.y.toFixed(4),
                +obj.scale.z.toFixed(4),
              ];
            const sceneId = obj.userData.sceneResId;
            if (sceneId) {
              const sr = getRes(sceneId);
              node.scene = sr ? `@external:${sr.name}` : null;
            }
            return node;
          }
          const nodeType = classifyObject(obj);
          const node = { type: nodeType, name: obj.name || nodeType };
          if (
            obj.position.x !== 0 ||
            obj.position.y !== 0 ||
            obj.position.z !== 0
          )
            node.position = [
              +obj.position.x.toFixed(4),
              +obj.position.y.toFixed(4),
              +obj.position.z.toFixed(4),
            ];
          if (
            obj.rotation.x !== 0 ||
            obj.rotation.y !== 0 ||
            obj.rotation.z !== 0
          )
            node.rotation = [
              +obj.rotation.x.toFixed(4),
              +obj.rotation.y.toFixed(4),
              +obj.rotation.z.toFixed(4),
            ];
          if (obj.scale.x !== 1 || obj.scale.y !== 1 || obj.scale.z !== 1)
            node.scale = [
              +obj.scale.x.toFixed(4),
              +obj.scale.y.toFixed(4),
              +obj.scale.z.toFixed(4),
            ];
          if (obj.isMesh && obj.geometry?.userData?.resource)
            node.mesh = `@internal:${obj.geometry.userData.resource.name}`;
          if (obj.isSprite && obj.material?.map?.userData?.resource)
            node.texture = `@internal:${obj.material.map.userData.resource.name}`;
          if (nodeType === "Skeleton3D") {
            const bones = [];
            obj.traverse((o) => {
              if (!o.isBone) return;
              let parentBone = null;
              let p = o.parent;
              while (p) {
                if (p.isBone) {
                  parentBone = p.name;
                  break;
                }
                p = p.parent;
              }
              const b = { name: o.name, parent: parentBone };
              if (
                o.position.x !== 0 ||
                o.position.y !== 0 ||
                o.position.z !== 0
              )
                b.position = [
                  +o.position.x.toFixed(4),
                  +o.position.y.toFixed(4),
                  +o.position.z.toFixed(4),
                ];
              if (
                o.quaternion.x !== 0 ||
                o.quaternion.y !== 0 ||
                o.quaternion.z !== 0 ||
                o.quaternion.w !== 1
              )
                b.rotation = [
                  +o.quaternion.x.toFixed(4),
                  +o.quaternion.y.toFixed(4),
                  +o.quaternion.z.toFixed(4),
                  +o.quaternion.w.toFixed(4),
                ];
              if (o.scale.x !== 1 || o.scale.y !== 1 || o.scale.z !== 1)
                b.scale = [
                  +o.scale.x.toFixed(4),
                  +o.scale.y.toFixed(4),
                  +o.scale.z.toFixed(4),
                ];
              bones.push(b);
            });
            node.bones = bones;
            return node;
          }
          const children = [];
          for (const c of obj.children) {
            if (c.isBone) continue;
            const cn = traverse(c);
            if (cn) children.push(cn);
          }
          if (children.length) node.children = children;
          return node;
        }
        if (res.data) {
          for (const child of res.data.children) {
            const cn = traverse(child);
            if (cn) nodes.push(cn);
          }
        }
        return {
          type: res.type === "scene" ? "Scene" : "Prefab",
          extension: res.type === "scene" ? "scene" : "glb",
          name: res.name,
          resources,
          nodes,
        };
      }
      function serializeMesh(r) {
        const geo = r.data;
        const attributes = {};
        for (const [name, attr] of Object.entries(geo.attributes)) {
          const sample = [];
          const n = Math.min(attr.count, 5);
          for (let i = 0; i < n; i++) {
            const v = [];
            for (let j = 0; j < attr.itemSize; j++)
              v.push(+attr.array[i * attr.itemSize + j].toFixed(4));
            sample.push(v);
          }
          attributes[name] = {
            itemSize: attr.itemSize,
            count: attr.count,
            sample,
            note: attr.count > 5 ? `... всего ${attr.count}` : undefined,
          };
        }
        return {
          type: "ArrayMesh",
          name: r.name,
          vertexCount: geo.attributes.position?.count || 0,
          indexCount: geo.index ? geo.index.count : 0,
          attributes,
          material: r.refs.material
            ? `@internal:${getRes(r.refs.material).name}`
            : null,
        };
      }
      function serializeMaterial(r) {
        const mat = r.data;
        const parameters = {};
        if (!mat.color.equals(new THREE.Color(0xffffff)))
          parameters["Albedo.color"] = "#" + mat.color.getHexString();
        if (mat.metalness !== 0.0) parameters["Metallic"] = mat.metalness;
        if (mat.roughness !== 1.0) parameters["Roughness"] = mat.roughness;
        for (const [slot, texId] of Object.entries(r.refs)) {
          const texRes = getRes(texId);
          if (texRes)
            parameters[`${slot[0].toUpperCase() + slot.slice(1)}.texture`] =
              `@internal:${texRes.name}`;
        }
        return { type: "Material", name: r.name, parameters };
      }
      function serializeTexture(r) {
        const tex = r.data;
        const dims = tex.image
          ? { width: tex.image.width, height: tex.image.height }
          : {};
        return {
          type: "Texture2D",
          name: r.name,
          ...dims,
          repeat: [tex.repeat.x, tex.repeat.y],
          offset: [tex.offset.x, tex.offset.y],
          rotation: tex.rotation,
          wrapS: tex.wrapS,
          wrapT: tex.wrapT,
        };
      }
      function serializeAnimationRes(r) {
        return {
          type: "Animation",
          name: r.name,
          clips: r.clips
            .map((id) => {
              const c = getRes(id);
              return c ? `@internal:${c.name}` : null;
            })
            .filter(Boolean),
        };
      }
      function serializeAnimationClip(r) {
        const clip = r.data;
        return {
          type: "AnimationClip",
          name: r.name,
          duration: +clip.duration.toFixed(3),
          tracks: clip.tracks.map((track) => {
            const dotIdx = track.name.lastIndexOf(".");
            const valueSize = track.getValueSize();
            const frames = [];
            for (let i = 0; i < track.times.length; i++) {
              const vals = [];
              for (let j = 0; j < valueSize; j++)
                vals.push(+track.values[i * valueSize + j].toFixed(4));
              frames.push({ t: +track.times[i].toFixed(4), v: vals });
            }
            return {
              bone: track.name.substring(0, dotIdx),
              property: track.name.substring(dotIdx + 1),
              valueSize,
              frames,
            };
          }),
        };
      }

      /* ============ RESOURCE SLOT ============ */
      function renderResourceSlot(
        owner,
        slotName,
        allowedTypes,
        label,
        contextNode = null,
      ) {
        let resId = owner.refs[slotName];
        if (
          contextNode &&
          contextNode.overrides &&
          contextNode.overrides[owner.id] &&
          contextNode.overrides[owner.id][slotName] !== undefined
        ) {
          resId = contextNode.overrides[owner.id][slotName];
        }
        const res = resId ? getRes(resId) : null;
        const isExpanded = res && expandedResources.has(res.id);
        const typesStr = allowedTypes.join(",");
        if (!res) {
          return `<div class="prop-block"><div class="prop-row"><label>${label}</label>
      <div class="prop-slot empty" data-owner-id="${owner.id}" data-slot="${slotName}" data-types="${typesStr}" data-ctx="${contextNode?.id || ""}" onclick="openEmptySlotMenu(event, '${owner.id}', '${slotName}', '${typesStr}', '${contextNode?.id || ""}')">
        <span class="empty-name">[ None ]</span><span class="slot-arrow">▼</span>
      </div></div></div>`;
        }
        return `<div class="prop-block ${isExpanded ? "expanded" : ""}">
    <div class="prop-row">
      <label>${label}</label>
      <div class="prop-slot" data-owner-id="${owner.id}" data-slot="${slotName}" data-types="${typesStr}" data-ctx="${contextNode?.id || ""}" onclick="toggleResourceExpand('${res.id}')">
        <span>${RES_ICON[res.type]}</span><span class="res-name">${res.name}</span>
      </div>
      <button class="slot-menu-btn" onclick="event.stopPropagation(); openResourceMenu(event, '${owner.id}', '${slotName}', '${typesStr}', '${contextNode?.id || ""}')" title="⋮">⋮</button>
    </div>
    ${isExpanded ? `<div class="prop-expanded-body">${renderResourceBody(res, contextNode)}</div>` : ""}
  </div>`;
      }
      function renderSkeletonUI(node) {
        const bones = node.bones || [];
        const sel = state.selectedBone;
        let html = `<div class="insp-group">Bone Hierarchy</div><div style="max-height:150px;overflow-y:auto;background:#222;padding:4px;">`;
        for (const b of bones)
          html += `<div class="tree-item ${sel === b ? "sel" : ""}" onclick="selectBone('${b.name}')">🦴 ${b.name}</div>`;
        html += `</div>`;
        if (sel) {
          html += `<div class="insp-group">Bone: ${sel.name}</div>`;
          html += `<div class="insp-row"><label>Pos</label>${["x", "y", "z"].map((a) => `<input type="number" step="0.01" value="${sel.position[a].toFixed(3)}" oninput="moveBone('${sel.name}','position','${a}',this.value)">`).join("")}</div>`;
          html += `<div class="insp-row"><label>Rot°</label>${["x", "y", "z"].map((a) => `<input type="number" step="1" value="${((sel.rotation[a] * 180) / Math.PI).toFixed(1)}" oninput="moveBone('${sel.name}','rotation','${a}',this.value)">`).join("")}</div>`;
        }
        return html;
      }
      window.selectNodeById = (id) => {
        const n = findNode(id);
        if (n) selectNode(n);
      };
      window.selectResById = (id) => {
        const r = getRes(id);
        if (r) selectResource(r);
      };
      window.toggleResourceExpand = function (resId) {
        if (expandedResources.has(resId)) expandedResources.delete(resId);
        else expandedResources.add(resId);
        renderInspector();
      };
      window.toggleSection = function (id) {
        if (collapsedSections.has(id)) collapsedSections.delete(id);
        else collapsedSections.add(id);
        renderInspector();
      };
      function getOwningPrefabId(owner) {
        if (!owner) return null;
        if (owner.object3d) {
          if (owner.refs?.prefab) return owner.refs.prefab;
          if (owner.refs?.scene) return owner.refs.scene;
          let p = owner.parent;
          while (p) {
            if (p.refs?.prefab) return p.refs.prefab;
            if (p.refs?.scene) return p.refs.scene;
            p = p.parent;
          }
        } else if (owner.owner) {
          const parentNode = findNode(owner.owner);
          if (parentNode) return getOwningPrefabId(parentNode);
        }
        return null;
      }
      window.openEmptySlotMenu = function (
        e,
        ownerId,
        slotName,
        typesStr,
        ctxId,
      ) {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        if (window.activeDropdown) window.activeDropdown.remove();
        const owner = getRes(ownerId) || findNode(ownerId);
        const ctx = ctxId ? findNode(ctxId) : null;
        showResourcePicker(rect, owner, slotName, typesStr.split(","), ctx);
      };
      window.openResourceMenu = function (
        e,
        ownerId,
        slotName,
        typesStr,
        ctxId,
      ) {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        if (window.activeDropdown) window.activeDropdown.remove();
        const owner = getRes(ownerId) || findNode(ownerId);
        const ctx = ctxId ? findNode(ctxId) : null;
        let resId = owner.refs[slotName];
        if (
          ctx &&
          ctx.overrides &&
          ctx.overrides[owner.id] &&
          ctx.overrides[owner.id][slotName] !== undefined
        ) {
          resId = ctx.overrides[owner.id][slotName];
        }
        const res = resId ? getRes(resId) : null;
        const allowed = typesStr.split(",");
        const menu = document.createElement("div");
        menu.className = "res-dropdown";
        if (res) {
          const change = document.createElement("div");
          change.className = "dropdown-item";
          change.textContent = "Сменить ресурс...";
          change.onclick = () => {
            menu.remove();
            window.activeDropdown = null;
            showResourcePicker(rect, owner, slotName, allowed, ctx);
          };
          menu.appendChild(change);
          const isInternal = !isAssetVisible(res);
          const conv = document.createElement("div");
          conv.className = "dropdown-item";
          if (isInternal) {
            conv.textContent = "Сделать External";
            conv.onclick = () => {
              const prefabId = getOwningPrefabId(owner);
              if (prefabId) {
                const p = getRes(prefabId);
                if (p?.internalResources)
                  p.internalResources = p.internalResources.filter(
                    (r) => r.id !== res.id,
                  );
              }
              state.currentSceneResources.delete(res.id);
              sync3DScene();
              renderAssets();
              renderInspector();
              menu.remove();
              window.activeDropdown = null;
            };
          } else {
            conv.textContent = "Сделать Internal";
            conv.onclick = () => {
              const nr = duplicateResource(res, owner.id);
              if (nr) {
                owner.refs[slotName] = nr.id;
                sync3DScene();
                renderInspector();
              }
              menu.remove();
              window.activeDropdown = null;
            };
          }
          menu.appendChild(conv);
          if (
            ctx &&
            ctx.overrides &&
            ctx.overrides[owner.id] &&
            ctx.overrides[owner.id][slotName] !== undefined
          ) {
            const reset = document.createElement("div");
            reset.className = "dropdown-item";
            reset.style.color = "#ff9800";
            reset.textContent = "Сбросить к оригиналу";
            reset.onclick = () => {
              delete ctx.overrides[owner.id][slotName];
              sync3DScene();
              renderInspector();
              menu.remove();
              window.activeDropdown = null;
            };
            menu.appendChild(reset);
          }
          const clear = document.createElement("div");
          clear.className = "dropdown-item";
          clear.style.color = "#ff8888";
          clear.textContent = "Отвязать";
          clear.onclick = () => {
            if (ctx && ctx.overrides && ctx.overrides[owner.id]) {
              delete ctx.overrides[owner.id][slotName];
              sync3DScene();
              renderInspector();
            } else {
              delete owner.refs[slotName];
              sync3DScene();
              renderInspector();
            }
            menu.remove();
            window.activeDropdown = null;
          };
          menu.appendChild(clear);
        }
        menu.style.left = Math.min(rect.left, window.innerWidth - 220) + "px";
        menu.style.top = rect.bottom + 2 + "px";
        document.body.appendChild(menu);
        window.activeDropdown = menu;
        setTimeout(
          () =>
            document.addEventListener("click", function close(ev) {
              if (!menu.contains(ev.target)) {
                menu.remove();
                window.activeDropdown = null;
                document.removeEventListener("click", close);
              }
            }),
          0,
        );
      };
      function showResourcePicker(
        rect,
        owner,
        slotName,
        allowedTypes,
        contextNode,
      ) {
        if (window.activeDropdown) window.activeDropdown.remove();
        const menu = document.createElement("div");
        menu.className = "res-dropdown";

        // Куда записать ссылку: в override (если owner внешний) или в refs (если внутренний)
        const bindNew = (resId) => {
          if (contextNode && isAssetVisible(owner)) {
            if (!contextNode.overrides) contextNode.overrides = {};
            if (!contextNode.overrides[owner.id])
              contextNode.overrides[owner.id] = {};
            contextNode.overrides[owner.id][slotName] = resId;
          } else {
            owner.refs[slotName] = resId;
          }
          state.currentSceneResources.add(resId);
          sync3DScene();
          renderInspector();
          renderAssets();
          menu.remove();
          window.activeDropdown = null;
        };

        // === 1. СУЩЕСТВУЮЩИЕ ИЗ ASSETS ===
        const matching = allRes().filter(
          (r) => isAssetVisible(r) && allowedTypes.includes(r.type),
        );
        if (matching.length) {
          const h = document.createElement("div");
          h.className = "dropdown-header";
          h.textContent = "Из Assets";
          menu.appendChild(h);
          for (const r of matching) {
            const item = document.createElement("div");
            item.className = "dropdown-item";
            item.innerHTML = `<span>${RES_ICON[r.type]}</span> ${r.name}`;
            item.onclick = () => {
              if (contextNode && isAssetVisible(owner)) {
                if (!contextNode.overrides) contextNode.overrides = {};
                if (!contextNode.overrides[owner.id])
                  contextNode.overrides[owner.id] = {};
                contextNode.overrides[owner.id][slotName] = r.id;
              } else {
                owner.refs[slotName] = r.id;
              }
              sync3DScene();
              renderInspector();
              menu.remove();
              window.activeDropdown = null;
            };
            menu.appendChild(item);
          }
        }

        // === 2. СОЗДАТЬ НОВЫЙ (встроенный в текущую сцену) ===
        const h2 = document.createElement("div");
        h2.className = "dropdown-header";
        h2.textContent = "Создать новый (встроенный)";
        menu.appendChild(h2);

        if (allowedTypes.includes("mesh")) {
          ["BoxMesh", "SphereMesh", "PlaneMesh"].forEach((t) => {
            const item = document.createElement("div");
            item.className = "dropdown-item";
            item.textContent = "New " + t;
            item.onclick = () => {
              const geo =
                t === "BoxMesh"
                  ? new THREE.BoxGeometry(1, 1, 1)
                  : t === "SphereMesh"
                    ? new THREE.SphereGeometry(0.5, 32, 16)
                    : new THREE.PlaneGeometry(1, 1);
              const newRes = addRes(
                new Resource("mesh", t + "_" + (RES_ID + 1), geo),
              );
              geo.userData.resource = newRes;
              // Сразу создадим материал по умолчанию, чтобы меш не был голым
              const defMat = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.5,
              });
              const matRes = addRes(
                new Resource("material", "Material_" + (RES_ID + 1), defMat),
              );
              defMat.userData.resource = matRes;
              newRes.refs.material = matRes.id;
              state.currentSceneResources.add(matRes.id);
              bindNew(newRes.id);
            };
            menu.appendChild(item);
          });
        }

        if (allowedTypes.includes("material")) {
          const item = document.createElement("div");
          item.className = "dropdown-item";
          item.textContent = "New StandardMaterial3D";
          item.onclick = () => {
            const mat = new THREE.MeshStandardMaterial({
              color: 0xcccccc,
              roughness: 0.5,
              metalness: 0.1,
            });
            const newRes = addRes(
              new Resource("material", "Material_" + (RES_ID + 1), mat),
            );
            mat.userData.resource = newRes;
            bindNew(newRes.id);
          };
          menu.appendChild(item);
        }

        if (allowedTypes.includes("texture")) {
          const item = document.createElement("div");
          item.className = "dropdown-item";
          item.textContent = "New Texture (Empty)";
          item.onclick = () => {
            const c = document.createElement("canvas");
            c.width = c.height = 128;
            const ctx = c.getContext("2d");
            for (let yy = 0; yy < 128; yy += 16)
              for (let xx = 0; xx < 128; xx += 16) {
                ctx.fillStyle = ((xx + yy) / 16) % 2 === 0 ? "#ccc" : "#888";
                ctx.fillRect(xx, yy, 16, 16);
              }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.needsUpdate = true;
            const newRes = addRes(
              new Resource("texture", "Texture_" + (RES_ID + 1), tex),
            );
            tex.userData.resource = newRes;
            bindNew(newRes.id);
          };
          menu.appendChild(item);
        }

        if (allowedTypes.includes("animation")) {
          const item = document.createElement("div");
          item.className = "dropdown-item";
          item.textContent = "New Animation";
          item.onclick = () => {
            const newRes = addRes(
              new Resource("animation", "Anim_" + (RES_ID + 1), null, {
                clips: [],
              }),
            );
            bindNew(newRes.id);
          };
          menu.appendChild(item);
        }

        // === 3. ИМПОРТ ===
        const h3 = document.createElement("div");
        h3.className = "dropdown-header";
        h3.textContent = "Импорт";
        menu.appendChild(h3);
        const imp = document.createElement("div");
        imp.className = "dropdown-item";
        imp.textContent = "📂 Импорт файла...";
        imp.onclick = () => {
          document.getElementById("file-input").click();
          menu.remove();
          window.activeDropdown = null;
        };
        menu.appendChild(imp);

        menu.style.left = Math.min(rect.left, window.innerWidth - 240) + "px";
        menu.style.top = rect.bottom + 2 + "px";
        menu.style.minWidth = Math.max(rect.width, 240) + "px";
        document.body.appendChild(menu);
        window.activeDropdown = menu;
        setTimeout(() => {
          document.addEventListener("click", function close(ev) {
            if (!menu.contains(ev.target)) {
              menu.remove();
              window.activeDropdown = null;
              document.removeEventListener("click", close);
            }
          });
        }, 0);
      }
      function duplicateResource(res, ownerId) {
        let newRes;
        if (res.type === "mesh") {
          newRes = new Resource("mesh", res.name + "_Copy", res.data.clone());
          if (res.refs.material) newRes.refs.material = res.refs.material;
        } else if (res.type === "material") {
          const m = res.data.clone();
          m.needsUpdate = true;
          newRes = new Resource("material", res.name + "_Copy", m);
          for (const [s, t] of Object.entries(res.refs)) newRes.refs[s] = t;
        } else if (res.type === "texture") {
          const t = res.data.clone();
          t.needsUpdate = true;
          newRes = new Resource("texture", res.name + "_Copy", t);
        } else if (res.type === "animation") {
          newRes = new Resource("animation", res.name + "_Copy", null, {
            clips: [...res.clips],
          });
        } else if (res.type === "animation_clip") {
          newRes = new Resource(
            "animation_clip",
            res.name + "_Copy",
            res.data.clone(),
          );
        }
        if (newRes) {
          addRes(newRes);
          state.currentSceneResources.add(newRes.id);
          if (ownerId) {
            const prefabId = getOwningPrefabId(
              getRes(ownerId) || findNode(ownerId),
            );
            if (prefabId) {
              const p = getRes(prefabId);
              if (p?.internalResources && !p.internalResources.includes(newRes))
                p.internalResources.push(newRes);
            }
          }
        }
        return newRes;
      }
      function bindInspectorEvents() {
        const body = document.getElementById("inspector-body");
        body.querySelectorAll("[data-mat-prop]").forEach((inp) => {
          inp.oninput = () => {
            const r = getRes(inp.dataset.matId);
            if (!r) return;
            const p = inp.dataset.matProp;
            let v;
            if (inp.type === "color") {
              v = inp.value;
              if (!r.data[p]) r.data[p] = new THREE.Color();
              r.data[p].set(v);
            } else if (inp.type === "range") {
              v = parseFloat(inp.value);
              r.data[p] = v;
              const el = inp.parentElement.querySelector(".val");
              if (el) el.textContent = v.toFixed(2);
            }
            const contextNode = state.selectedNode;
            if (contextNode && isAssetVisible(r)) {
              if (!contextNode.overrides) contextNode.overrides = {};
              if (!contextNode.overrides[r.id])
                contextNode.overrides[r.id] = {};
              contextNode.overrides[r.id][p] = v;
              sync3DScene();
            } else {
              r.data.needsUpdate = true;
              sync3DScene();
            }
          };
          inp.onchange = () => {
            if (state.selectedNode) renderInspector();
          };
        });
        body.querySelectorAll("[data-node-prop]").forEach((inp) => {
          inp.oninput = () => {
            const n = findNode(inp.dataset.nodeId);
            if (!n) return;
            let v = parseFloat(inp.value) || 0;
            if (inp.dataset.nodeProp === "rotation") v *= Math.PI / 180;
            n.object3d[inp.dataset.nodeProp][inp.dataset.axis] = v;
            n.object3d.updateMatrixWorld(true);
          };
        });
        body.querySelectorAll("[data-tex-id]").forEach((inp) => {
          const texRes = getRes(inp.dataset.texId);
          if (!texRes) return;
          const tex = texRes.data;
          const forceUpdate = () => {
            tex.needsUpdate = true;
            tex.matrixAutoUpdate = true;
            world.traverse((o) => {
              if (o.isMesh && o.material) {
                const ms = Array.isArray(o.material)
                  ? o.material
                  : [o.material];
                for (const m of ms)
                  if (
                    m.map === tex ||
                    m.normalMap === tex ||
                    m.emissiveMap === tex ||
                    m.roughnessMap === tex ||
                    m.metalnessMap === tex
                  )
                    m.needsUpdate = true;
              }
            });
          };
          inp.oninput = () => {
            const p = inp.dataset.texProp;
            if (
              p === "minFilter" ||
              p === "magFilter" ||
              p === "wrapS" ||
              p === "wrapT"
            )
              tex[p] = parseInt(inp.value);
            else if (p === "repeatX") {
              tex.repeat.x = parseFloat(inp.value);
              if (tex.wrapS !== THREE.RepeatWrapping)
                tex.wrapS = THREE.RepeatWrapping;
            } else if (p === "repeatY") {
              tex.repeat.y = parseFloat(inp.value);
              if (tex.wrapT !== THREE.RepeatWrapping)
                tex.wrapT = THREE.RepeatWrapping;
            } else if (p === "offsetX") tex.offset.x = parseFloat(inp.value);
            else if (p === "offsetY") tex.offset.y = parseFloat(inp.value);
            else if (p === "rotationDeg")
              tex.rotation = (parseFloat(inp.value) * Math.PI) / 180;
            else if (p === "flipY") tex.flipY = inp.checked;
            forceUpdate();
          };
          inp.onchange = () => renderInspector();
        });
        const animSelect = document.getElementById("mixer-anim-select");
        if (animSelect) {
          animSelect.onchange = () => {
            const node = state.selectedNode;
            if (!node || node.type !== "AnimationMixer") return;
            node.currentAnimIndex = parseInt(animSelect.value);
            rebuildMixerActions(node);
            renderInspector();
            if (node.refs.animation) {
              state.currentAnimResource = getRes(node.refs.animation);
              state.currentAnimClipId =
                state.currentAnimResource.clips[node.currentAnimIndex];
              renderAnimationEditor();
            }
          };
        }
        const playingCheckbox = document.getElementById(
          "mixer-playing-checkbox",
        );
        if (playingCheckbox)
          playingCheckbox.onchange = () => {
            const node = state.selectedNode;
            if (!node || node.type !== "AnimationMixer") return;
            node.isPlaying = playingCheckbox.checked;
            if (node.currentAction) node.currentAction.paused = !node.isPlaying;
            state.animIsPlaying = node.isPlaying;
            renderAnimationEditor();
          };
        const loopCheckbox = document.getElementById("mixer-loop-checkbox");
        if (loopCheckbox)
          loopCheckbox.onchange = () => {
            const node = state.selectedNode;
            if (!node || node.type !== "AnimationMixer") return;
            node.loop = loopCheckbox.checked;
            if (node.currentAction)
              node.currentAction.setLoop(
                node.loop ? THREE.LoopRepeat : THREE.LoopOnce,
                Infinity,
              );
          };
        const speedInput = document.getElementById("mixer-speed-input");
        if (speedInput)
          speedInput.oninput = () => {
            const node = state.selectedNode;
            if (!node || node.type !== "AnimationMixer") return;
            node.timeScale = parseFloat(speedInput.value) || 1;
            if (node.currentAction)
              node.currentAction.timeScale = node.timeScale;
          };
        body.querySelectorAll(".prop-slot").forEach((slotEl) => {
          const types = slotEl.dataset.types
            ? slotEl.dataset.types.split(",")
            : [];
          slotEl.ondragover = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (currentDragType && types.includes(currentDragType)) {
              e.dataTransfer.dropEffect = "copy";
              slotEl.classList.add("drag-valid");
              slotEl.classList.remove("drag-invalid");
            } else {
              e.dataTransfer.dropEffect = "none";
              slotEl.classList.add("drag-invalid");
              slotEl.classList.remove("drag-valid");
            }
          };
          slotEl.ondragleave = (e) => {
            e.stopPropagation();
            slotEl.classList.remove("drag-valid", "drag-invalid");
          };
          slotEl.ondrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            slotEl.classList.remove("drag-valid", "drag-invalid");
            const resId = e.dataTransfer.getData("text/plain");
            const res = getRes(resId);
            if (!res) return;
            if (types.includes(res.type)) {
              const owner =
                getRes(slotEl.dataset.ownerId) ||
                findNode(slotEl.dataset.ownerId);
              const ctx = slotEl.dataset.ctx
                ? findNode(slotEl.dataset.ctx)
                : null;
              const slot = slotEl.dataset.slot;
              if (ctx && isAssetVisible(owner)) {
                if (!ctx.overrides) ctx.overrides = {};
                if (!ctx.overrides[owner.id]) ctx.overrides[owner.id] = {};
                ctx.overrides[owner.id][slot] = res.id;
              } else {
                owner.refs[slot] = res.id;
              }
              sync3DScene();
              renderInspector();
            }
          };
        });
      }
      function cleanupMixers(node) {
        if (node.type === "AnimationMixer" && node.mixer) {
          const idx = activeMixers.indexOf(node.mixer);
          if (idx !== -1) activeMixers.splice(idx, 1);
          node.mixer.stopAllAction();
        }
        for (const c of node.children) cleanupMixers(c);
      }
      window.deleteNode = function (id) {
        const node = findNode(id);
        if (!node) return;
        cleanupMixers(node);
        if (node.object3d && node.object3d.parent)
          node.object3d.parent.remove(node.object3d);
        const removeFromParent = (parent, target) => {
          parent.children = parent.children.filter((c) => c !== target);
          for (const c of parent.children) removeFromParent(c, target);
        };
        removeFromParent(state.sceneRoot, node);
        rebuildTree();
        state.selectedNode = null;
        renderInspector();
        setStatus(`Узел "${node.name}" удалён`);
      };
      window.selectBone = function (name) {
        const n = state.selectedNode;
        if (!n || !n.bones) return;
        state.selectedBone = n.bones.find((b) => b.name === name);
        renderInspector();
      };
      window.moveBone = function (name, prop, axis, val) {
        const n = state.selectedNode;
        if (!n || !n.bones) return;
        const b = n.bones.find((x) => x.name === name);
        if (!b) return;
        let v = parseFloat(val) || 0;
        if (prop === "rotation") v *= Math.PI / 180;
        b[prop][axis] = v;
        b.updateMatrixWorld(true);
      };

      /* ============ GLTF LOADER ============ */
      const loader = new GLTFLoader();
      function loadGLB(f) {
        const r = new FileReader();
        r.onload = (e) => {
          loader.parse(
            e.target.result,
            "",
            (g) => onModelLoaded(g, f.name),
            (err) => {
              console.error(err);
              setStatus("Ошибка GLB");
            },
          );
        };
        r.readAsArrayBuffer(f);
      }
      function loadGLTFMulti(files) {
        const g = files.find((f) => /\.gltf$/i.test(f.name));
        if (!g) return setStatus("Нет .gltf");
        const map = new Map();
        for (const f of files) map.set(f.name, URL.createObjectURL(f));
        const mgr = new THREE.LoadingManager();
        mgr.setURLModifier(
          (u) => map.get(u.split("/").pop().split("?")[0]) || u,
        );
        new GLTFLoader(mgr).load(
          map.get(g.name),
          (gl) => onModelLoaded(gl, g.name),
          undefined,
          (e) => {
            console.error(e);
            setStatus("Ошибка gltf");
          },
        );
      }

      function onModelLoaded(gltf, filename) {
        const prefabName = filename.replace(/\.(glb|gltf)$/i, "");
        const prefabRes = addRes(
          new Resource("prefab", prefabName, gltf.scene, { imported: true }),
        );
        prefabRes.internalNodes = [];
        prefabRes.internalResources = [];
        const seenGeos = new Map();
        const seenMats = new Map();
        const usedMeshIds = new Set();

        gltf.scene.traverse((o) => {
          if (!o.isMesh && !o.isSkinnedMesh) return;
          let meshRes = seenGeos.get(o.geometry.uuid);
          if (!meshRes) {
            meshRes = addRes(
              new Resource(
                "mesh",
                (o.name || "Mesh") + "_ArrayMesh",
                o.geometry,
              ),
            );
            seenGeos.set(o.geometry.uuid, meshRes);
            usedMeshIds.add(meshRes.id);
            o.geometry.userData.resource = meshRes;
          }
          o.userData._meshResId = meshRes.id;

          const mat = Array.isArray(o.material) ? o.material[0] : o.material;
          if (mat) {
            let matRes = seenMats.get(mat.uuid);
            if (!matRes) {
              matRes = addRes(
                new Resource("material", mat.name || "Material", mat),
              );
              seenMats.set(mat.uuid, matRes);
              meshRes.refs.material = matRes.id;
              usedMeshIds.add(matRes.id);
              mat.userData.resource = matRes;
              for (const [threeSlot, ourSlot] of Object.entries({
                map: "albedo",
                normalMap: "normal",
              })) {
                const tex = mat[threeSlot];
                if (tex?.isTexture) {
                  let texRes = tex.userData.resource;
                  if (!texRes) {
                    texRes = addRes(
                      new Resource("texture", `${mat.name}_${ourSlot}`, tex, {
                        imported: true,
                      }),
                    );
                    tex.userData.resource = texRes;
                  }
                  matRes.refs[ourSlot] = texRes.id;
                  usedMeshIds.add(texRes.id);
                }
              }
            }
          }
        });

        for (const rId of usedMeshIds) {
          const r = getRes(rId);
          if (r) prefabRes.internalResources.push(r);
        }

        const animClips = [];
        for (const clip of gltf.animations || []) {
          const clipRes = addRes(
            new Resource("animation_clip", clip.name || "clip", clip),
          );
          animClips.push(clipRes.id);
          prefabRes.internalResources.push(clipRes);
        }
        let animRes = null;
        if (animClips.length > 0) {
          animRes = addRes(
            new Resource("animation", `${prefabName}_Anim`, null, {
              clips: animClips,
            }),
          );
          prefabRes.internalResources.push(animRes);
        }

        // internalNodes (все объекты кроме костей)
        (function walk(obj) {
          if (obj.isBone) return;
          const type = classifyObject(obj);
          prefabRes.internalNodes.push({
            id: "n" + ++NODE_ID,
            type,
            name: obj.name || type,
            object3d: obj,
            parent: null,
            children: [],
            refs: {},
          });
          for (const c of obj.children) walk(c);
        })(gltf.scene);

        if (animRes) {
          prefabRes.internalNodes.push({
            id: "n" + ++NODE_ID,
            type: "AnimationMixer",
            name: "AnimationMixer",
            object3d: null,
            parent: null,
            children: [],
            refs: { animation: animRes.id },
            currentAnimIndex: 0,
            isPlaying: true,
            timeScale: 1.0,
            loop: true,
            mixer: null,
            virtual: true,
          });
        }

        renderAssets();
        renderInspector();
        sync3DScene();
        setStatus(
          `✅ Импорт: Префаб «${prefabName}» (${prefabRes.internalNodes.length} узлов, ${prefabRes.internalResources.length} ресурсов)`,
        );
      }

      function setStatus(t) {
        document.getElementById("status").textContent = t;
      }
      document.getElementById("file-input").onchange = (e) => {
        handleFiles(e.target.files);
        e.target.value = "";
      };

      function handleFiles(files) {
        const arr = Array.from(files);
        const glb = arr.find((f) => /\.glb$/i.test(f.name));
        const gltf = arr.find((f) => /\.gltf$/i.test(f.name));
        if (glb) return loadGLB(glb);
        if (gltf) return loadGLTFMulti(arr);
        for (const f of arr) {
          if (!f.type.startsWith("image/")) continue;
          const url = URL.createObjectURL(f);
          const img = new Image();
          img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.needsUpdate = true;
            const r = addRes(
              new Resource("texture", f.name, tex, { imported: true }),
            );
            tex.userData.resource = r;
            renderAssets();
            setStatus(`Текстура «${f.name}» добавлена`);
          };
          img.src = url;
        }
      }

      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        document.getElementById("drop-zone").classList.remove("dragover");
        const internalResId = e.dataTransfer.getData("text/plain");
        if (internalResId && library.has(internalResId)) return;
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0)
          handleFiles(e.dataTransfer.files);
      });
      const dz = document.getElementById("drop-zone");
      dz.addEventListener("dragover", (e) => {
        e.preventDefault();
        dz.classList.add("dragover");
      });
      dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));

      const clock = new THREE.Clock();
      function tick() {
        requestAnimationFrame(tick);
        const dt = clock.getDelta();
        for (const mixer of activeMixers) mixer.update(dt);
        world.traverse((o) => {
          if (o.userData.billboard) o.quaternion.copy(camera.quaternion);
        });
        controls.update();
        renderer.render(scene, camera);
        const mixerNode = findActiveMixerNode();
        if (mixerNode && mixerNode.currentAction) {
          if (state.animIsPlaying) {
            state.animCurrentTime = mixerNode.currentAction.time;
            if (
              !mixerNode.loop &&
              state.animCurrentTime >=
                mixerNode.currentAction.getClip().duration
            ) {
              state.animIsPlaying = false;
              const playBtn = document.getElementById("anim-play-btn");
              if (playBtn) playBtn.textContent = "▶";
            }
            updateAnimPlayhead();
          }
        }
      }
      tick();
      renderSceneTree();
      renderAssets();
      renderInspector();
    </script>
  </body>
</html>
