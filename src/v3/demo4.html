        color: #9cdcfe;
      }
      .json-string {
        color: #ce9178;
      }
      .json-number {
        color: #b5cea8;
      }
      .json-bool {
        color: #569cd6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <strong>◆ 3D EDITOR v46</strong>
        <button id="btn-save-scene" class="ghost">💾 Сохранить сцену</button>
        <span id="status">Готов</span>
      </div>
      <div id="scene-tree-panel">
        <div class="panel-title">
          Scene Tree <button id="btn-add-node" title="Добавить узел">+</button>
        </div>

          <div class="placeholder">Пустая сцена</div>
        </div>
      </div>
      <div id="viewport"></div>
      <div id="inspector">
        <div class="panel-title">Inspector</div>

        </div>
      </div>
      <div id="bottom-panel">
        <div class="bottom-tabs">
          <div class="bottom-tab active" data-tab="assets">ASSETS</div>
          <div class="bottom-tab" data-tab="animation">ANIMATION</div>
          <button id="btn-add-asset" title="Создать ресурс">+</button>
        </div>
        <div id="assets-panel" class="panel-view active">
          <div id="drop-zone">
            Перетащите .glb / .gltf / .png сюда (или ПКМ для меню)
          </div>
          <div class="asset-toolbar">
            <span id="asset-count" style="color: #555">(0)</span>
            <span style="color: #888; margin-left: 8px">Фильтр:</span>
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="prefab">Префабы</button>
            <button class="filter-btn" data-filter="scene">Сцены</button>
            <button class="filter-btn" data-filter="texture">Текстуры</button>
            <button class="filter-btn" data-filter="material">Материалы</button>
            <button class="filter-btn" data-filter="mesh">Меши</button>
            <button class="filter-btn" data-filter="animation">Анимации</button>
          </div>
          <div class="asset-grid" id="asset-grid"></div>
        </div>
        <div id="animation-panel" class="panel-view">
          <div class="anim-header">
            <button class="anim-header-btn" id="anim-play-btn">▶</button>
            <input
              type="range"
              id="anim-time-slider"
              min="0"
              max="1"
              step="0.001"

              style="flex: 1"

            <div
              style="width: 1px; height: 16px; background: #444; margin: 0 4px"
            ></div>

          </div>
          <div class="anim-main">
            <div class="anim-clips-list" id="anim-clips-list"></div>
            <div class="anim-timeline-container">
              <div class="anim-ruler" id="anim-ruler"></div>
              <div class="anim-tracks" id="anim-tracks"></div>
              <div class="playhead" id="anim-playhead"></div>
            </div>
          </div>
          <div class="anim-info" id="anim-info">
            Выберите узел AnimationMixer или ресурс Animation
          </div>
        </div>
      </div>
    </div>
    <input
      type="file"
      id="file-input"
      accept=".glb,.gltf,.png,.jpg,.jpeg,.webp,.bin"
      multiple
      hidden
    />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { clone as cloneSkeleton } from "three/addons/utils/SkeletonUtils.js";

      class ThreeRenderer {
        constructor(c) {
          this.renderer = new THREE.WebGLRenderer({ antialias: true });
          this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          this.renderer.shadowMap.enabled = true;
          this.renderer.outputColorSpace = THREE.SRGBColorSpace;
          c.appendChild(this.renderer.domElement);
        }
        setSize(w, h) {
          this.renderer.setSize(w, h, false);
        }
        render(s, c) {
          this.renderer.render(s, c);
        }
      }
      const viewport = document.getElementById("viewport");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181818);
      scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));
      scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.2));
      const sun = new THREE.DirectionalLight(0xffffff, 1.8);
      sun.position.set(5, 10, 7);
      scene.add(sun);
      const world = new THREE.Group();
      world.name = "World";
      scene.add(world);

      const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 1000);
      camera.position.set(3, 3, 5);
      const renderer = new ThreeRenderer(viewport);
      const controls = new OrbitControls(camera, renderer.renderer.domElement);
      controls.enableDamping = true;

      function resize() {
        const w = viewport.clientWidth,
          h = viewport.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      addEventListener("resize", resize);
      resize();

      let RES_ID = 0,
        NODE_ID = 0;
      const library = new Map();
      const expandedResources = new Set();
      const collapsedSections = new Set();
      const activeMixers = [];
      let currentDragType = null;

      class Resource {
        constructor(type, name, data, opts = {}) {
          this.id = "res_" + ++RES_ID;
          this.type = type;
          this.name = name;
          this.data = data;
          this.refs = opts.refs || {};
          this.clips = opts.clips || [];
          this.owner = opts.owner || null;
          this.internalNodes = opts.internalNodes || null;
          this.internalResources = opts.internalResources || null;
          this.imported = opts.imported || false;
        }
      }
      function addRes(r) {
        library.set(r.id, r);
        return r;
      }
      function getRes(id) {
        return library.get(id);
      }
      function allRes() {
        return [...library.values()];
      }

      const NODE_ICON = {
        Node3D: "⬚",
        Model3D: "🧊",
        MeshInstance3D: "◯",
        SkinnedMeshInstance3D: "⬡",
        Skeleton3D: "💀",
        Sprite3D: "🖼",
        Light3D: "💡",
        Camera3D: "📷",
        AnimationMixer: "🎬",
        SceneInstance: "🗺️",
      };
      const RES_ICON = {
        prefab: "📦",
        scene: "🗺️",
        mesh: "△",
        material: "🎨",
        texture: "🖼",
        animation: "🎬",
        animation_clip: "🎞️",
      };

      function classifyObject(o) {
        if (o.isSkinnedMesh) return "SkinnedMeshInstance3D";
        if (o.isMesh) return "MeshInstance3D";
        if (o.isSprite) return "Sprite3D";
        if (o.isLight) return "Light3D";
        if (o.isCamera) return "Camera3D";
        if (o.userData.isModelRoot) return "Model3D";
        if (o.children.length > 0 && o.children.every((c) => c.isBone))
          return "Skeleton3D";
        return "Node3D";
      }

      function makeSceneNode(obj, parent, old = null) {
        if (obj.isBone) return null;
        let type = classifyObject(obj);
        const isSceneInstance = !!obj.userData.isSceneInstance;
        if (isSceneInstance && (!old || old.type !== "SceneInstance"))
          type = "SceneInstance";
        const node = {
          id: old?.id || "n" + ++NODE_ID,
          type,
          name: obj.name || obj.type || "Node",
          object3d: obj,
          parent,
          children: [],
          refs: old?.refs ? { ...old.refs } : {},
          overrides: old?.overrides
            ? JSON.parse(JSON.stringify(old.overrides))
            : {},
          hideChildren: isSceneInstance,
          bones: old?.bones || null,
          mixer: old?.mixer || null,
          currentAction: old?.currentAction || null,
          currentAnimIndex: old?.currentAnimIndex ?? 0,
          isPlaying: old?.isPlaying ?? true,
          timeScale: old?.timeScale ?? 1.0,
          loop: old?.loop ?? true,
        };
        obj.userData.sceneNode = node;
        if (type === "Skeleton3D") {
          node.bones = [];
          obj.traverse((o) => {
            if (o.isBone) node.bones.push(o);
          });
          return node;
        }
        for (const c of obj.children) {
          if (c.isBone) continue;
          const oc = old?.children.find((x) => x.object3d === c) || null;
          const cn = makeSceneNode(c, node, oc);
          if (cn) node.children.push(cn);
        }
        if (old) {
          for (const oc of old.children) {
            if (!oc.object3d) {
              oc.parent = node;
              node.children.push(oc);
            }
          }
        }
        return node;
      }

      const state = {
        sceneRoot: null,
        selectedNode: null,
        selectedResource: null,
        selectedBone: null,
        model: null,
        assetFilter: "all",
        currentAnimResource: null,
        currentAnimClipId: null,
        animIsPlaying: false,
        animCurrentTime: 0,
        selectedKeyframe: null,
        currentSceneResources: new Set(),
        currentSceneResId: null,
      };
      state.sceneRoot = makeSceneNode(world, null);

      /* ============ RESOLVE MESH REFS (через userData._meshResId) ============ */
      function resolveMeshRefs(clone, internalResources) {
        const byId = new Map();
        for (const r of internalResources)
          if (r.type === "mesh") byId.set(r.id, r);
        const pairs = [];
        clone.traverse((o) => {
          if (!o.isMesh && !o.isSkinnedMesh) return;
          let mr = null;
          if (o.userData._meshResId) mr = byId.get(o.userData._meshResId);
          if (!mr && o.geometry?.userData?.resource?.id)
            mr = byId.get(o.geometry.userData.resource.id);
          if (mr) pairs.push({ obj: o, meshRes: mr });
        });
        return pairs;
      }

      /* ============ ATTACH MIXER для открытой сцены ============ */
      function attachMixerToScene() {
        // Ищем animation resource среди currentSceneResources
        let animRes = null;
        for (const rId of state.currentSceneResources) {
          const r = getRes(rId);
          if (r && r.type === "animation") {
            animRes = r;
            break;
          }
        }
        if (!animRes) return;

        // Ищем AnimationMixer узел уже
        let found = null;
        (function walk(n) {
          if (!n || found) return;
          if (n.type === "AnimationMixer") {
            found = n;
            return;
          }
          for (const c of n.children) walk(c);
        })(state.sceneRoot);
        if (found) return;

        // Найти цель: Skeleton3D (приоритет) или первый узел
        let targetNode = null;
        (function find(node) {
          if (!node || targetNode) return;
          if (node.type === "Skeleton3D") {
            targetNode = node;
            return;
          }
          for (const c of node.children) find(c);
        })(state.sceneRoot);
        if (!targetNode) targetNode = state.sceneRoot.children[0];
        if (!targetNode) return;

        const mixerNode = {
          id: "n" + ++NODE_ID,
          type: "AnimationMixer",
          name: "AnimationMixer",
          object3d: null,
          parent: targetNode,
          children: [],
          refs: { animation: animRes.id },
          currentAnimIndex: 0,
          isPlaying: true,
          timeScale: 1.0,
          loop: true,
          mixer: null,
        };
        targetNode.children.push(mixerNode);
      }

      /* ============ SYNC 3D SCENE ============ */
      function sync3DScene() {
        function walk(node) {
          if (!node) return;
          if (node.type === "AnimationMixer") {
            rebuildMixerActions(node);
            return;
          }
          const obj = node.object3d;
          if (node.type === "Sprite3D" && obj) {
            const texId =
              node.refs.texture || node.overrides?.[obj.uuid]?.texture;
            if (texId) {
              const t = getRes(texId);
              if (t && obj.material) obj.material.map = t.data;
            }
          }
          if (
            obj &&
            (node.type === "MeshInstance3D" ||
              node.type === "SkinnedMeshInstance3D")
          ) {
            const meshRes = node.refs.mesh ? getRes(node.refs.mesh) : null;
            if (meshRes) {
              obj.geometry = meshRes.data;
              const matRes = meshRes.refs.material
                ? getRes(meshRes.refs.material)
                : null;
              if (matRes) {
                let material = matRes.data;
                const ov = node.overrides && node.overrides[matRes.id];
                if (ov && Object.keys(ov).length > 0) {
                  const savedRes = material.userData?.resource;
                  if (material.userData) delete material.userData.resource;
                  try {
                    material = matRes.data.clone();
                  } catch (e) {
                    material = matRes.data;
                  }
                  if (savedRes && matRes.data.userData)
                    matRes.data.userData.resource = savedRes;
                  if (material.userData) material.userData.resource = matRes;
                  material.needsUpdate = true;
                  if (ov.color !== undefined) material.color.set(ov.color);
                  if (ov.metalness !== undefined)
                    material.metalness = ov.metalness;
                  if (ov.roughness !== undefined)
                    material.roughness = ov.roughness;
                  if (ov.albedo !== undefined) {
                    const t = ov.albedo ? getRes(ov.albedo) : null;
                    material.map = t ? t.data : null;
                  } else if (matRes.refs.albedo) {
                    const t = getRes(matRes.refs.albedo);
                    if (t) material.map = t.data;
                  } else material.map = null;
                  if (ov.normal !== undefined) {
                    const t = ov.normal ? getRes(ov.normal) : null;
                    material.normalMap = t ? t.data : null;
                  } else if (matRes.refs.normal) {
                    const t = getRes(matRes.refs.normal);
                    if (t) material.normalMap = t.data;
                  } else material.normalMap = null;
                } else {
                  material.needsUpdate = true;
                  if (matRes.refs.albedo) {
                    const t = getRes(matRes.refs.albedo);
                    if (t) material.map = t.data;
                  } else {
                    material.map = null;
                  }
                  if (matRes.refs.normal) {
                    const t = getRes(matRes.refs.normal);
                    if (t) material.normalMap = t.data;
                  } else {
                    material.normalMap = null;
                  }
                }
                obj.material = material;
              }
            }
          }
          for (const c of node.children) walk(c);
        }
        walk(state.sceneRoot);
      }

      function rebuildMixerActions(node) {
        if (node.type !== "AnimationMixer") return;
        const animId = node.refs.animation;
        if (!animId) return;
        const animRes = getRes(animId);
        if (!animRes || !animRes.clips) return;
        const clips = animRes.clips
          .map((id) => getRes(id)?.data)
          .filter(Boolean);
        if (clips.length === 0) return;
        if (!node.mixer) {
          const parentObj = node.parent.object3d;
          if (!parentObj) return;
          node.mixer = new THREE.AnimationMixer(parentObj);
          activeMixers.push(node.mixer);
        }
        node.mixer.stopAllAction();
        const idx = Math.max(
          0,
          Math.min(node.currentAnimIndex, clips.length - 1),
        );
        node.currentAnimIndex = idx;
        const action = node.mixer.clipAction(clips[idx]);
        action.play();
        action.paused = !node.isPlaying;
        action.timeScale = node.timeScale;
        action.setLoop(node.loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
        node.currentAction = action;
      }

      /* ============ GC: используются ли ресурсы ============ */
      function collectUsedResources(rootNode) {
        const used = new Set();
        function visitResource(resId) {
          if (!resId || used.has(resId)) return;
          used.add(resId);
          const r = getRes(resId);
          if (!r) return;
          if (r.refs)
            for (const rid of Object.values(r.refs))
              if (rid) visitResource(rid);
          if (r.clips) for (const cid of r.clips) if (cid) visitResource(cid);
        }
        function walk(node) {
          if (!node) return;
          if (node.refs)
            for (const refId of Object.values(node.refs))
              if (refId) visitResource(refId);
          if (node.overrides) {
            for (const ov of Object.values(node.overrides)) {
              for (const v of Object.values(ov))
                if (typeof v === "string" && v.startsWith("res_"))
                  visitResource(v);
            }
          }
          for (const c of node.children) walk(c);
        }
        walk(rootNode);
        return used;
      }

      /* ============ NODE CREATORS ============ */
      function createNodeMeshInstance() {
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xcccccc,
          roughness: 0.5,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.name = "MeshInstance3D";
        mesh.position.y = 0.5;
        mesh.castShadow = mesh.receiveShadow = true;
        world.add(mesh);
        rebuildTree();
        const node =
          state.sceneRoot.children[state.sceneRoot.children.length - 1];
        if (!node) return;
        const meshRes = addRes(
          new Resource("mesh", "BoxMesh_" + (RES_ID + 1), geo),
        );
        const matRes = addRes(
          new Resource("material", "Material_" + (RES_ID + 1), mat),
        );
        meshRes.refs.material = matRes.id;
        geo.userData.resource = meshRes;
        mat.userData.resource = matRes;
        mesh.userData._meshResId = meshRes.id;
        node.refs.mesh = meshRes.id;
        state.currentSceneResources.add(meshRes.id);
        state.currentSceneResources.add(matRes.id);
        selectNode(node);
        sync3DScene();
        setStatus("✅ Добавлен MeshInstance3D");
      }
      function createNodeSprite3D() {
        const geo = new THREE.PlaneGeometry(1, 1);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
          transparent: true,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.name = "Sprite3D";
        mesh.position.set(0, 1, 0);
        mesh.userData.billboard = true;
        world.add(mesh);
        rebuildTree();
        const node =
          state.sceneRoot.children[state.sceneRoot.children.length - 1];
        if (node) selectNode(node);
        setStatus("✅ Добавлен Sprite3D");
      }
      function createNodeEmpty() {
        const group = new THREE.Group();
        group.name = "Node3D";
        world.add(group);
        rebuildTree();
        const node =
          state.sceneRoot.children[state.sceneRoot.children.length - 1];
        if (node) selectNode(node);
      }

      /* ============ INSTANTIATION ============ */
      function instantiateAssetInWorld(res) {
        if (res.type === "mesh") {
          const mat = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            roughness: 0.5,
          });
          const mesh = new THREE.Mesh(res.data, mat);
          mesh.name = "MeshInstance3D";
          mesh.position.y = 0.5;
          mesh.castShadow = mesh.receiveShadow = true;
          world.add(mesh);
          const node = makeSceneNode(mesh, state.sceneRoot);
          state.sceneRoot.children.push(node);
          node.refs.mesh = res.id;
          if (!res.refs.material) {
            const newRes = addRes(
              new Resource("material", "Material_" + (RES_ID + 1), mat),
            );
            res.refs.material = newRes.id;
            state.currentSceneResources.add(newRes.id);
          }
          rebuildTree();
          sync3DScene();
          selectNode(node);
          setStatus(`Добавлен MeshInstance3D из ${res.name}`);
        } else if (res.type === "texture") {
          const geo = new THREE.PlaneGeometry(1, 1);
          const mat = new THREE.MeshStandardMaterial({
            map: res.data,
            transparent: true,
            side: THREE.DoubleSide,
            alphaTest: 0.5,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.name = "Sprite3D";
          mesh.position.set(0, 1, 0);
          mesh.userData.billboard = true;
          world.add(mesh);
          const node = makeSceneNode(mesh, state.sceneRoot);
          if (node) {
            state.sceneRoot.children.push(node);
            node.refs.texture = res.id;
          }
          rebuildTree();
          sync3DScene();
          if (node) selectNode(node);
          setStatus(`Добавлен Sprite3D из ${res.name}`);
        } else if (res.type === "prefab") {
          const clone = cloneSkeleton(res.data);
          clone.name = res.name;
          clone.userData.isModelRoot = true;
          clone.traverse((o) => {
            delete o.userData.sceneNode;
          });
          world.add(clone);
          const node = makeSceneNode(clone, state.sceneRoot);
          if (node) {
            state.sceneRoot.children.push(node);
            node.refs.prefab = res.id;
            const pairs = resolveMeshRefs(clone, res.internalResources || []);
            for (const { obj, meshRes } of pairs) {
              const n = obj.userData.sceneNode;
              if (n) n.refs.mesh = meshRes.id;
            }
            const animRes = res.internalResources.find(
              (r) => r.type === "animation",
            );
            if (animRes) {
              const mixerNode = {
                id: "n" + ++NODE_ID,
                type: "AnimationMixer",
                name: "AnimationMixer",
                object3d: null,
                parent: node,
                children: [],
                refs: { animation: animRes.id },
                currentAnimIndex: 0,
                isPlaying: true,
                timeScale: 1.0,
                loop: true,
                mixer: null,
              };
              node.children.push(mixerNode);
            }
          }
          rebuildTree();
          sync3DScene();
          if (node) selectNode(node);
          setStatus(`Инстанс префаба ${res.name} добавлен`);
        } else if (res.type === "scene") {
          const containerClone = cloneSkeleton(res.data);
          containerClone.name = res.name;
          containerClone.userData.isSceneInstance = true;
          containerClone.userData.sceneResId = res.id;
          containerClone.traverse((o) => {
            delete o.userData.sceneNode;
          });
          world.add(containerClone);
          const node = makeSceneNode(containerClone, state.sceneRoot);
          if (node) {
            state.sceneRoot.children.push(node);
            node.refs.scene = res.id;
            const pairs = resolveMeshRefs(
              containerClone,
              res.internalResources || [],
            );
            for (const { obj, meshRes } of pairs) {
              const n = obj.userData.sceneNode;
              if (n) n.refs.mesh = meshRes.id;
            }
          }
          rebuildTree();
          sync3DScene();
          if (node) selectNode(node);
          setStatus(`Сцена "${res.name}" вставлена как instance`);
        }
      }

      /* ============ OPEN SCENE (С ATTACH MIXER + MESH REFS) ============ */
      function openScene(sceneId) {
        const res = getRes(sceneId);
        if (!res) return;

        while (world.children.length > 0) world.remove(world.children[0]);

        if (res.type === "prefab") {
          const clone = cloneSkeleton(res.data);
          clone.traverse((o) => {
            delete o.userData.sceneNode;
          });
          clone.userData.isModelRoot = true;
          world.add(clone);
        } else {
          const containerClone = cloneSkeleton(res.data);
          containerClone.traverse((o) => {
            delete o.userData.sceneNode;
          });
          while (containerClone.children.length > 0) {
            world.add(containerClone.children[0]);
          }
        }

        state.currentSceneResources.clear();
        if (res.internalResources)
          for (const r of res.internalResources)
            state.currentSceneResources.add(r.id);
        state.currentSceneResId = res.id;

        state.sceneRoot = makeSceneNode(world, null);

        // Восстановить mesh refs
        const pairs = resolveMeshRefs(world, res.internalResources || []);
        for (const { obj, meshRes } of pairs) {
          const n = obj.userData.sceneNode;
          if (n) n.refs.mesh = meshRes.id;
        }

        // Прикрепить AnimationMixer
        attachMixerToScene();

        rebuildTree();
        sync3DScene();
        setStatus(
          `📂 Открыта сцена "${res.name}" (${state.currentSceneResources.size} рес.)`,
        );
      }

      /* ============ SAVE SCENE (с удалением orphan'ов из library) ============ */
      function saveSceneAsResource(name) {
        // GC
        const used = collectUsedResources(state.sceneRoot);
        const orphans = [];
        for (const resId of [...state.currentSceneResources]) {
          if (!used.has(resId)) orphans.push(resId);
        }

        // Удаляем orphans из library ПОЛНОСТЬЮ и из всех prefab/scene
        for (const resId of orphans) {
          const orphanRes = getRes(resId);
          if (!orphanRes) continue;
          // Найти все prefab/scene, где он в internalResources
          for (const p of allRes()) {
            if (
              (p.type === "prefab" || p.type === "scene") &&
              p.internalResources
            ) {
              p.internalResources = p.internalResources.filter(
                (r) => r.id !== resId,
              );
            }
          }
          // Удалить из library и currentSceneResources
          library.delete(resId);
          state.currentSceneResources.delete(resId);
          // Убрать из других ресурсов.refs (например, material.refs.albedo = orphan)
          for (const r of allRes()) {
            if (r.refs)
              for (const [slot, ref] of Object.entries(r.refs))
                if (ref === resId) delete r.refs[slot];
          }
        }

        const resources = [];
        for (const resId of state.currentSceneResources) {
          const r = getRes(resId);
          if (r) resources.push(r);
        }

        // Strip userData
        const savedUD = [];
        function stripUD(obj) {
          if (!obj || !obj.userData) return;
          if (Object.keys(obj.userData).length > 0) {
            const bak = { ...obj.userData };
            savedUD.push({ obj, data: bak });
            obj.userData = {};
          }
        }
        world.traverse((o) => {
          stripUD(o);
          if (o.geometry) stripUD(o.geometry);
          if (o.material) {
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of ms) stripUD(m);
          }
        });

        const sceneContainer = new THREE.Group();
        sceneContainer.name = name;
        sceneContainer.userData.isModelRoot = true;

        let errMsg = "";
        try {
          for (const child of world.children)
            sceneContainer.add(cloneSkeleton(child));
        } catch (e) {
          errMsg = "SkeletonUtils: " + e.message;
        }

        for (const { obj, data } of savedUD) obj.userData = data;
        if (errMsg) {
          setStatus("❌ " + errMsg);
          return;
        }

        const existing = state.currentSceneResId
          ? getRes(state.currentSceneResId)
          : null;

        if (
          existing &&
          (existing.type === "scene" || existing.type === "prefab")
        ) {
          existing.data = sceneContainer;
          existing.name = name;
          existing.internalResources = resources;
          existing.internalNodes = [];
          for (const child of sceneContainer.children) {
            (function walk(obj) {
              if (obj.isBone) return;
              const type = classifyObject(obj);
              existing.internalNodes.push({
                id: "n" + ++NODE_ID,
                type,
                name: obj.name || type,
                object3d: obj,
                parent: null,
                children: [],
                refs: {},
              });
              for (const c of obj.children) walk(c);
            })(child);
          }
          state.assetFilter = "all";
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.filter === "all"),
            );
          renderAssets();
          selectResource(existing);
          setStatus(
            `✅ Сцена "${name}" обновлена (${resources.length} рес., удалено ${orphans.length})`,
          );
          return;
        }

        const sceneRes = addRes(
          new Resource("scene", name, sceneContainer, { imported: true }),
        );
        sceneRes.internalResources = resources;
        sceneRes.internalNodes = [];
        for (const child of sceneContainer.children) {
          (function walk(obj) {
            if (obj.isBone) return;
            const type = classifyObject(obj);
            sceneRes.internalNodes.push({
              id: "n" + ++NODE_ID,
              type,
              name: obj.name || type,
              object3d: obj,
              parent: null,
              children: [],
              refs: {},
            });
            for (const c of obj.children) walk(c);
          })(child);
        }

        state.currentSceneResId = sceneRes.id;
        state.assetFilter = "all";
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.filter === "all"),
          );
        renderAssets();
        selectResource(sceneRes);
        setStatus(
          `✅ Сцена "${name}" создана (${resources.length} рес., удалено ${orphans.length})`,
        );
      }

      document.getElementById("btn-save-scene").onclick = () => {
        let name = state.currentSceneResId
          ? getRes(state.currentSceneResId)?.name || "Scene"
          : "Scene_" + Date.now();
        try {
          const p = window.prompt("Имя сцены:", name);
          if (p !== null && p !== undefined && p !== "") name = p;
        } catch (e) {}
        saveSceneAsResource(name);
      };

      /* ============ TREE ============ */
      function rebuildTree() {
        state.sceneRoot = makeSceneNode(world, null, state.sceneRoot);
        renderSceneTree();
      }
      function renderSceneTree() {
        const c = document.getElementById("scene-tree");
        c.innerHTML = "";
        if (!state.sceneRoot.children.length) {
          c.innerHTML =
            '<div class="placeholder">Пустая сцена<br><small>Нажмите + вверху</small></div>';
          return;
        }
        for (const ch of state.sceneRoot.children)
          c.appendChild(renderNodeEl(ch, 0));
      }
      function renderNodeEl(node, depth) {
        const wrap = document.createElement("div");
        const el = document.createElement("div");
        el.className =
          "tree-item" +
          (state.selectedNode === node && !state.selectedResource
            ? " sel"
            : "");
        el.style.paddingLeft = 6 + depth * 12 + "px";
        let icon;
        if (node.type === "SceneInstance") icon = "🗺️";
        else if (node.refs && node.refs.prefab) icon = "📦";
        else icon = NODE_ICON[node.type] || "·";
        const boneCount =
          node.type === "Skeleton3D" ? ` (${node.bones.length} bones)` : "";
        const hasOv = Object.keys(node.overrides || {}).length > 0;
        el.innerHTML = `<span class="icon">${icon}</span><span class="name">${node.name}${boneCount}</span>${hasOv ? '<span style="color:#ff9800;">*</span>' : ""}`;
        if (node.type === "SceneInstance" && node.refs.scene) {
          const btn = document.createElement("button");
          btn.className = "open-scene-btn";
          btn.textContent = "📂";
          btn.title = "Открыть оригинальную сцену";
          btn.onclick = (e) => {
            e.stopPropagation();
            openScene(node.refs.scene);
          };
          el.appendChild(btn);
        }
        el.title = node.type;
        el.onclick = (e) => {
          e.stopPropagation();
          selectNode(node);
        };
        wrap.appendChild(el);
        if (!node.hideChildren) {
          for (const ch of node.children)
            wrap.appendChild(renderNodeEl(ch, depth + 1));
        }
        return wrap;
      }
      function selectNode(n) {
        state.selectedNode = n;
        state.selectedResource = null;
        if (n.type !== "Skeleton3D") state.selectedBone = null;
        if (n.type === "AnimationMixer") {
          const animId = n.refs.animation;
          if (animId) {
            const animRes = getRes(animId);
            if (animRes) {
              state.currentAnimResource = animRes;
              state.currentAnimClipId =
                animRes.clips[n.currentAnimIndex] || animRes.clips[0];
            }
          } else {
            state.currentAnimResource = null;
            state.currentAnimClipId = null;
          }
          switchTab("animation");
          renderAnimationEditor();
        } else {
          if (
            document
              .querySelector('.bottom-tab[data-tab="animation"]')
              .classList.contains("active")
          ) {
            state.currentAnimResource = null;
            state.currentAnimClipId = null;
            renderAnimationEditor();
          }
        }
        renderSceneTree();
        renderAssets();
        renderInspector();
      }
      function selectResource(r) {
        state.selectedResource = r;
        state.selectedNode = null;
        if (r.type === "animation") {
          state.currentAnimResource = r;
          state.currentAnimClipId = r.clips[0] || null;
          switchTab("animation");
          renderAnimationEditor();
        } else if (r.type === "animation_clip") {
          const parentAnim = allRes().find(
            (x) => x.type === "animation" && x.clips && x.clips.includes(r.id),
          );
          if (parentAnim) state.currentAnimResource = parentAnim;
          else
            state.currentAnimResource = { clips: [r.id], name: "(standalone)" };
          state.currentAnimClipId = r.id;
          switchTab("animation");
          renderAnimationEditor();
        }
        renderSceneTree();
        renderAssets();
        renderInspector();
      }
      function findNode(id) {
        let found = null;
        (function walk(n) {
          if (!n || found) return;
          if (n.id === id) found = n;
          for (const c of n.children) walk(c);
        })(state.sceneRoot);
        return found;
      }
      function findActiveMixerNode() {
        if (state.selectedNode?.type === "AnimationMixer")
          return state.selectedNode;
        let found = null;
        (function walk(n) {
          if (!n || found) return;
          if (n.type === "AnimationMixer") found = n;
          for (const c of n.children) walk(c);
        })(state.sceneRoot);
        return found;
      }

      /* ============ TABS ============ */
      function switchTab(name) {
        document
          .querySelectorAll(".bottom-tab")
          .forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
        document
          .getElementById("assets-panel")
          .classList.toggle("active", name === "assets");
        document
          .getElementById("animation-panel")
          .classList.toggle("active", name === "animation");
      }
      document.querySelectorAll(".bottom-tab").forEach((tab) => {
        tab.onclick = () => {
          switchTab(tab.dataset.tab);
          if (tab.dataset.tab === "animation") renderAnimationEditor();
        };
      });

      /* ============ ANIM EDITOR ============ */
      function updateAnimPlayhead() {
        const slider = document.getElementById("anim-time-slider");
        const disp = document.getElementById("anim-time-display");
        const playhead = document.getElementById("anim-playhead");
        if (!state.currentAnimResource || !state.currentAnimClipId) return;
        const clipRes = getRes(state.currentAnimClipId);
        if (!clipRes) return;
        const dur = clipRes.data.duration || 1;
        slider.value = state.animCurrentTime;
        disp.textContent = state.animCurrentTime.toFixed(2) + "s";
        if (playhead)
          playhead.style.left = (state.animCurrentTime / dur) * 100 + "%";
      }
      function renderAnimationEditor() {
        const clipsList = document.getElementById("anim-clips-list");
        const tracksEl = document.getElementById("anim-tracks");
        const rulerEl = document.getElementById("anim-ruler");
        const infoEl = document.getElementById("anim-info");
        const selectEl = document.getElementById("anim-clip-select");
        const playBtn = document.getElementById("anim-play-btn");
        const animRes = state.currentAnimResource;
        if (!animRes || !animRes.clips || animRes.clips.length === 0) {
          clipsList.innerHTML = "";
          tracksEl.innerHTML =
            '<div class="anim-placeholder">Выберите узел AnimationMixer в дереве сцены<br>или ресурс Animation в ассетах</div>';
          rulerEl.innerHTML = "";
          selectEl.innerHTML = "";
          playBtn.disabled = true;
          infoEl.textContent = "Нет активной анимации";
          return;
        }
        playBtn.disabled = false;
        selectEl.innerHTML = animRes.clips
          .map((id) => {
            const c = getRes(id);
            return `<option value="${id}" ${state.currentAnimClipId === id ? "selected" : ""}>${c?.name || "clip"}</option>`;
          })
          .join("");
        selectEl.onchange = () => {
          state.currentAnimClipId = selectEl.value;
          state.animCurrentTime = 0;
          state.selectedKeyframe = null;
          const mixerNode = findActiveMixerNode();
          if (mixerNode) {
            const idx = animRes.clips.indexOf(state.currentAnimClipId);
            if (idx !== -1) {
              mixerNode.currentAnimIndex = idx;
              rebuildMixerActions(mixerNode);
              mixerNode.isPlaying = state.animIsPlaying;
            }
          }
          renderAnimationEditor();
          renderInspector();
        };
        playBtn.textContent = state.animIsPlaying ? "⏸" : "▶";
        playBtn.onclick = () => {
          state.animIsPlaying = !state.animIsPlaying;
          playBtn.textContent = state.animIsPlaying ? "⏸" : "▶";
          const mixerNode = findActiveMixerNode();
          if (mixerNode && mixerNode.currentAction) {
            mixerNode.isPlaying = state.animIsPlaying;
            mixerNode.currentAction.paused = !state.animIsPlaying;
          }
        };
        clipsList.innerHTML = "";
        animRes.clips.forEach((clipId) => {
          const c = getRes(clipId);
          if (!c) return;
          const el = document.createElement("div");
          el.className =
            "clip-item" + (state.currentAnimClipId === clipId ? " active" : "");
          el.textContent = c.name;
          el.onclick = () => {
            state.currentAnimClipId = clipId;
            state.animCurrentTime = 0;
            state.selectedKeyframe = null;
            const mixerNode = findActiveMixerNode();
            if (mixerNode) {
              const idx = animRes.clips.indexOf(clipId);
              if (idx !== -1) {
                mixerNode.currentAnimIndex = idx;
                rebuildMixerActions(mixerNode);
                mixerNode.isPlaying = state.animIsPlaying;
              }
            }
            renderAnimationEditor();
            renderInspector();
          };
          clipsList.appendChild(el);
        });
        if (
          !state.currentAnimClipId ||
          !animRes.clips.includes(state.currentAnimClipId)
        )
          state.currentAnimClipId = animRes.clips[0];
        const clipRes = getRes(state.currentAnimClipId);
        if (!clipRes) return;
        const clip = clipRes.data;
        const duration = Math.max(clip.duration, 0.001);
        document.getElementById("anim-time-slider").max = duration;
        rulerEl.innerHTML = "";
        const tickCount = Math.ceil(duration * 5) + 1;
        const step = duration / (tickCount - 1);
        for (let i = 0; i < tickCount; i++) {
          const t = i * step;
          const pct = (t / duration) * 100;
          const tick = document.createElement("div");
          tick.className = "ruler-tick";
          tick.style.left = pct + "%";
          tick.textContent = t.toFixed(1) + "s";
          rulerEl.appendChild(tick);
        }
        tracksEl.innerHTML = "";
        const grouped = {};
        clip.tracks.forEach((track) => {
          const fullName = track.name;
          const dotIdx = fullName.lastIndexOf(".");
          const boneName =
            dotIdx !== -1 ? fullName.substring(0, dotIdx) : "Root";
          if (!grouped[boneName]) grouped[boneName] = [];
          grouped[boneName].push(track);
        });
        const gh = document.createElement("div");
        gh.className = "track-group-header";
        gh.textContent = "Skeleton3D";
        tracksEl.appendChild(gh);
        for (const [boneName, tracks] of Object.entries(grouped)) {
          tracks.forEach((track) => {
            const row = document.createElement("div");
            row.className = "track-row";
            row.onclick = () => {
              state.selectedKeyframe = null;
              renderInspector();
            };
            const label = document.createElement("div");
            label.className = "track-label";
            label.textContent = `🦴 ${boneName} : ${track.name.substring(track.name.lastIndexOf(".") + 1)}`;
            row.appendChild(label);
            const bar = document.createElement("div");
            bar.className = "track-bar";
            const valSize = track.getValueSize();
            const times = track.times;
            const values = track.values;
            for (let i = 0; i < times.length; i++) {
              const t = times[i];
              const pct = (t / duration) * 100;
              const vals = [];
              for (let j = 0; j < valSize; j++)
                vals.push(+values[i * valSize + j].toFixed(4));
              const kf = document.createElement("div");
              kf.className = "keyframe";
              kf.style.left = pct + "%";
              kf.onclick = (e) => {
                e.stopPropagation();
                document
                  .querySelectorAll(".keyframe.selected")
                  .forEach((el) => el.classList.remove("selected"));
                kf.classList.add("selected");
                state.animCurrentTime = t;
                state.selectedKeyframe = {
                  trackIndex: clip.tracks.indexOf(track),
                  keyIndex: i,
                  trackName: track.name,
                  time: t,
                  values: vals.slice(),
                };
                updateAnimPlayhead();
                renderInspector();
                infoEl.textContent = `${track.name}  |  t = ${t.toFixed(4)}s  |  [${vals.map((v) => v.toFixed(4)).join(", ")}]`;
              };
              bar.appendChild(kf);
            }
            row.appendChild(bar);
            tracksEl.appendChild(row);
          });
        }
        infoEl.textContent = `${clip.name}  ·  ${clip.tracks.length} треков  ·  ${duration.toFixed(2)}s`;
        updateAnimPlayhead();
      }
      document.getElementById("anim-time-slider").oninput = (e) => {
        state.animCurrentTime = parseFloat(e.target.value);
        updateAnimPlayhead();
        const mixerNode = findActiveMixerNode();
        if (mixerNode && mixerNode.currentAction) {
          mixerNode.currentAction.time = state.animCurrentTime;
          mixerNode.mixer.update(0);
        }
      };

      /* ============ ASSETS ============ */
      function isAssetVisible(r) {
        if (r.type === "prefab" || r.type === "scene") return true;
        if (r.type === "animation_clip") {
          for (const a of allRes().filter((x) => x.type === "animation")) {
            if (a.clips && a.clips.includes(r.id)) return false;
          }
        }
        if (state.currentSceneResources.has(r.id)) return false;
        for (const p of allRes().filter(
          (x) => x.type === "prefab" || x.type === "scene",
        )) {
          if (p.internalResources && p.internalResources.includes(r))
            return false;
        }
        return true;
      }
      function renderAssets() {
        const grid = document.getElementById("asset-grid");
        grid.innerHTML = "";
        const items = [];
        for (const r of allRes()) {
          if (!isAssetVisible(r)) continue;
          if (
            state.assetFilter !== "all" &&
            state.assetFilter !== r.type &&
            !(state.assetFilter === "animation" && r.type === "animation_clip")
          )
            continue;
          items.push(r);
        }
        for (const r of items) {
          const el = document.createElement("div");
          el.className = "asset-item";
          el.draggable = true;
          const th = document.createElement("div");
          th.className = "asset-thumb";
          const url = thumbFor(r);
          th.innerHTML = url
            ? `<img src="${url}" draggable="false">`
            : `<span style="font-size:20px">${RES_ICON[r.type] || "?"}</span>`;
          if (r.type === "scene" || r.type === "prefab") {
            const badge = document.createElement("div");
            badge.className = "ext-badge";
            badge.textContent = r.type === "scene" ? "scene" : "glb";
            th.appendChild(badge);
          }
          el.appendChild(th);
          const lb = document.createElement("div");
          lb.className = "label";
          lb.textContent = r.name;
          el.appendChild(lb);
          el.onclick = () => selectResource(r);
          el.oncontextmenu = (e) => {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, r);
          };
          el.ondblclick = () => {
            if (r.type === "prefab" || r.type === "scene") openScene(r.id);
          };
          el.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", r.id);
            currentDragType = r.type;
          };
          el.ondragend = () => {
            currentDragType = null;
          };
          grid.appendChild(el);
        }
        document.getElementById("asset-count").textContent =
          `(${items.length})`;
      }
      function thumbFor(r) {
        if (r.type === "texture") return texURL(r.data);
        if (r.type === "material") {
          if (r.data.map) return texURL(r.data.map);
          if (r.data.color) return solidURL("#" + r.data.color.getHexString());
        }
        return null;
      }
      function solidURL(c) {
        const cv = document.createElement("canvas");
        cv.width = cv.height = 64;
        const x = cv.getContext("2d");
        x.fillStyle = c;
        x.fillRect(0, 0, 64, 64);
        x.strokeStyle = "rgba(0,0,0,.3)";
        x.strokeRect(0.5, 0.5, 63, 63);
        return cv.toDataURL();
      }
      function texURL(t) {
        if (!t?.image && !t?.isCanvasTexture) return null;
        try {
          const c = document.createElement("canvas");
          if (t.image) {
            c.width = t.image.width || 64;
            c.height = t.image.height || 64;
            c.getContext("2d").drawImage(t.image, 0, 0);
          } else if (t.isCanvasTexture) {
            c.width = t.source.data.width;
            c.height = t.source.data.height;
            c.getContext("2d").drawImage(t.source.data, 0, 0);
          }
          return c.toDataURL("image/png");
        } catch {
          return null;
        }
      }
      document.querySelectorAll(".filter-btn").forEach((b) => {
        b.onclick = () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          state.assetFilter = b.dataset.filter;
          renderAssets();
        };
      });

      /* ============ CONTEXT MENU ============ */
      function newSceneResource() {
        const name =
          prompt("Имя новой сцены:", "Scene_" + Date.now()) ||
          "Scene_" + Date.now();
        const container = new THREE.Group();
        container.name = name;
        container.userData.isModelRoot = true;
        const r = addRes(
          new Resource("scene", name, container, { imported: true }),
        );
        r.internalNodes = [];
        r.internalResources = [];
        state.assetFilter = "all";
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.filter === "all"),
          );
        renderAssets();
        selectResource(r);
      }
      function showContextMenu(x, y, targetRes = null) {
        if (window.activeDropdown) window.activeDropdown.remove();
        const menu = document.createElement("div");
        menu.className = "res-dropdown";
        if (targetRes) {
          const h = document.createElement("div");
          h.className = "dropdown-header";
          h.textContent = targetRes.name;
          menu.appendChild(h);
          if (targetRes.type === "prefab" || targetRes.type === "scene") {
            const open = document.createElement("div");
            open.className = "dropdown-item";
            open.textContent = "📂 Открыть сцену";
            open.onclick = () => {
              openScene(targetRes.id);
              menu.remove();
              window.activeDropdown = null;
            };
            menu.appendChild(open);
          }
          const del = document.createElement("div");
          del.className = "dropdown-item";
          del.style.color = "#ff8888";
          del.textContent = "🗑 Удалить";
          del.onclick = () => {
            if (state.currentSceneResId === targetRes.id)
              state.currentSceneResId = null;
            library.delete(targetRes.id);
            state.currentSceneResources.delete(targetRes.id);
            renderAssets();
            renderInspector();
            menu.remove();
            window.activeDropdown = null;
          };
          menu.appendChild(del);
        } else {
          const h = document.createElement("div");
          h.className = "dropdown-header";
          h.textContent = "Создать";
          menu.appendChild(h);
          const items = [

                  new Resource("mesh", "BoxMesh_" + (RES_ID + 1), geo),

                state.currentSceneResources.add(r.id);

              },
            },
            {
              label: "🎨 New Material",
              fn: () => {
                const mat = new THREE.MeshStandardMaterial({
                  color: 0xcccccc,
                  roughness: 0.5,
                  metalness: 0.1,
                });
                const r = addRes(

                state.currentSceneResources.add(r.id);

              },

            {
              label: "🖼 New Texture",
              fn: () => {
                const c = document.createElement("canvas");
                c.width = c.height = 128;
                const ctx = c.getContext("2d");
                for (let yy = 0; yy < 128; yy += 16)
                  for (let xx = 0; xx < 128; xx += 16) {
                    ctx.fillStyle =
                      ((xx + yy) / 16) % 2 === 0 ? "#ccc" : "#888";
                    ctx.fillRect(xx, yy, 16, 16);
                  }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.needsUpdate = true;
                const r = addRes(
                  new Resource("texture", "Texture_" + (RES_ID + 1), tex),

        menu.style.left = Math.min(x, window.innerWidth - 250) + "px";
        menu.style.top = Math.min(y, window.innerHeight - 300) + "px";
        menu.style.minWidth = "220px";
        document.body.appendChild(menu);
        window.activeDropdown = menu;
        setTimeout(() => {
          document.addEventListener("click", function close(ev) {
            if (!menu.contains(ev.target)) {
              menu.remove();

      }
      document.getElementById("asset-grid").oncontextmenu = (e) => {
        if (e.target.closest(".asset-item")) return;

        showContextMenu(e.clientX, e.clientY, null);

      document.getElementById("btn-add-asset").onclick = (e) => {
        e.stopPropagation();

      document.getElementById("btn-add-node").onclick = (e) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        if (window.activeDropdown) window.activeDropdown.remove();
        const menu = document.createElement("div");
        menu.className = "res-dropdown";
        const h = document.createElement("div");
        h.className = "dropdown-header";
        h.textContent = "Добавить узел";

        const nodeTypes = [
          {
            icon: "◯",
            label: "MeshInstance3D (Box)",

        menu.style.top = rect.bottom + 4 + "px";
        menu.style.minWidth = "220px";

        window.activeDropdown = menu;
        setTimeout(() => {
          document.addEventListener("click", function close(ev) {
            if (!menu.contains(ev.target)) {

      const viewportEl = document.getElementById("viewport");
      const treePanelEl = document.getElementById("scene-tree-panel");
      [viewportEl, treePanelEl].forEach((el) => {
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (currentDragType) {
            e.dataTransfer.dropEffect = "copy";
            el.classList.add("drag-over");
          } else {
            e.dataTransfer.dropEffect = "none";
          }
        });
        el.addEventListener("dragleave", () =>
          el.classList.remove("drag-over"),
        );
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          el.classList.remove("drag-over");

            const res = getRes(resId);
            if (res) instantiateAssetInWorld(res);

      });

      /* ============ INSPECTOR ============ */
      function renderInspector() {
        const body = document.getElementById("inspector-body");
        if (state.selectedKeyframe) {
          const sk = state.selectedKeyframe;
          let html = `<div class="insp-header" style="background:#0e639c;">Keyframe: ${sk.trackName.split(".").pop()}</div>`;
          html += `<div class="insp-row"><label>Track</label><span style="font-size:10px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${sk.trackName}">${sk.trackName}</span></div>`;
          html += `<div class="insp-row"><label>Time</label><input type="number" step="0.01" value="${sk.time.toFixed(4)}" id="kf-time"></div>`;
          for (let j = 0; j < sk.values.length; j++)
            html += `<div class="insp-row"><label>Val ${j}</label><input type="number" step="0.01" value="${sk.values[j].toFixed(4)}" id="kf-val-${j}"></div>`;
          html += `<div class="insp-row"><button class="tiny" onclick="updateKeyframeData()" style="flex:1">Применить</button><button class="tiny ghost" onclick="state.selectedKeyframe=null; renderInspector();" style="margin-left:4px;">✕</button></div>`;
          body.innerHTML = html;
          return;
        }
        if (state.selectedResource) {
          body.innerHTML =
            `<div class="insp-header"><span>${RES_ICON[state.selectedResource.type]}</span><span>${state.selectedResource.name}</span></div>` +
            renderResourceBody(state.selectedResource, null);
          bindInspectorEvents();
          return;
        }
        if (state.selectedNode) {
          const node = state.selectedNode;
          const o = node.object3d;
          let html = `<div class="insp-header"><span>${NODE_ICON[node.type] || "·"}</span><span>${node.name}</span>
      <button class="tiny danger" style="margin-left:auto;flex-shrink:0" onclick="deleteNode('${node.id}')">Удалить</button></div>`;
          if (node.type === "SceneInstance") {
            const sceneRes = node.refs.scene ? getRes(node.refs.scene) : null;
            html += `<div class="insp-row"><label>Type</label><span>SceneInstance</span></div>`;
            html += `<div class="insp-row"><label>Scene</label><span class="res-name" style="color:#a8c8e8;flex:1">${sceneRes ? sceneRes.name : "(missing)"}</span></div>`;
            html += `<div class="insp-row"><button class="tiny" style="flex:1" onclick="openScene('${node.refs.scene}')">📂 Открыть сцену</button></div>`;
            html += `<div class="insp-note">Дети скрыты. Нажмите "Открыть", чтобы редактировать.</div>`;
            html += `<div class="insp-group">Transform</div>`;
            const numIn = (p, a, v, st) =>
              `<input type="number" step="${st}" value="${(+v).toFixed(3)}" data-node-id="${node.id}" data-node-prop="${p}" data-axis="${a}">`;
            html += `<div class="insp-row"><label>Position</label>${["x", "y", "z"].map((a) => numIn("position", a, o.position[a], 0.01)).join("")}</div>`;
            html += `<div class="insp-row"><label>Rotation°</label>${["x", "y", "z"].map((a) => numIn("rotation", a, (o.rotation[a] * 180) / Math.PI, 1)).join("")}</div>`;
            html += `<div class="insp-row"><label>Scale</label>${["x", "y", "z"].map((a) => numIn("scale", a, o.scale[a], 0.01)).join("")}</div>`;
            body.innerHTML = html;
            bindInspectorEvents();
            return;
          }
          if (node.type === "Skeleton3D") {
            html += `<div class="insp-row"><label>Bones</label><span>${node.bones.length}</span></div>`;
            html += renderSkeletonUI(node);
          } else if (node.type === "AnimationMixer") {
            html += `<div class="insp-group" style="margin-top:0;border-top:none;">Animation</div>`;
            html += renderResourceSlot(
              node,
              "animation",
              ["animation"],
              "Resource",
              node,
            );
            const animId = node.refs.animation;
            const animRes = animId ? getRes(animId) : null;
            if (!animRes) {
              html += `<div class="insp-note" style="text-align:center;padding:8px;"><button class="tiny" onclick="createAnimResourceForMixer('${node.id}')">+ Создать Animation</button></div>`;
            } else if (animRes.clips.length > 0) {
              const clipOpts = animRes.clips
                .map((id, i) => {
                  const c = getRes(id);
                  return `<option value="${i}" ${i === node.currentAnimIndex ? "selected" : ""}>${c?.name || "clip_" + i}</option>`;
                })
                .join("");
              html += `<div class="insp-row"><label>Current</label><select id="mixer-anim-select" style="flex:1">${clipOpts}</select></div>`;
              html += `<div class="insp-row"><label>Playing</label><input type="checkbox" id="mixer-playing-checkbox" ${node.isPlaying ? "checked" : ""}></div>`;
              html += `<div class="insp-row"><label>Loop</label><input type="checkbox" id="mixer-loop-checkbox" ${node.loop ? "checked" : ""}></div>`;
              html += `<div class="insp-row"><label>Speed</label><input type="number" step="0.1" min="0" value="${node.timeScale}" id="mixer-speed-input" style="width:60px"></div>`;
            } else {
              html += `<div class="insp-note" style="text-align:center;padding:8px;"><button class="tiny" onclick="addEmptyClipToAnim('${animRes.id}')">+ Добавить клип</button></div>`;
            }
          } else {
            html += `<div class="insp-group">Transform</div>`;
            const numIn = (p, a, v, st) =>
              `<input type="number" step="${st}" value="${(+v).toFixed(3)}" data-node-id="${node.id}" data-node-prop="${p}" data-axis="${a}">`;
            html += `<div class="insp-row"><label>Position</label>${["x", "y", "z"].map((a) => numIn("position", a, o.position[a], 0.01)).join("")}</div>
        <div class="insp-row"><label>Rotation°</label>${["x", "y", "z"].map((a) => numIn("rotation", a, (o.rotation[a] * 180) / Math.PI, 1)).join("")}</div>
        <div class="insp-row"><label>Scale</label>${["x", "y", "z"].map((a) => numIn("scale", a, o.scale[a], 0.01)).join("")}</div>`;

          if (
            node.type === "MeshInstance3D" ||
            node.type === "SkinnedMeshInstance3D"

          }
          if (node.type === "Sprite3D") {
            html += `<div class="insp-group">Properties</div>`;
            html += renderResourceSlot(
              node,
              "texture",
              ["texture"],
              "Texture",
              node,
            );
          }
          body.innerHTML = html;
          bindInspectorEvents();
          return;
        }
        body.innerHTML =
          '<div class="placeholder">Выберите узел или ресурс</div>';
      }

      window.updateKeyframeData = function () {
        if (!state.selectedKeyframe) return;
        const sk = state.selectedKeyframe;
        const clipRes = getRes(state.currentAnimClipId);
        if (!clipRes) return;
        const clip = clipRes.data;
        const track = clip.tracks[sk.trackIndex];
        if (!track) return;
        const newTime = parseFloat(document.getElementById("kf-time").value);
        const valSize = track.getValueSize();
        const newVals = [];
        for (let j = 0; j < valSize; j++)
          newVals.push(
            parseFloat(document.getElementById(`kf-val-${j}`).value),
          );
        const timesArr = Array.from(track.times);
        timesArr[sk.keyIndex] = newTime;
        track.times = new Float32Array(timesArr);
        const valsArr = Array.from(track.values);
        for (let j = 0; j < valSize; j++)
          valsArr[sk.keyIndex * valSize + j] = newVals[j];
        track.values = new Float32Array(valsArr);
        clip.resetDuration();
        const mixerNode = findActiveMixerNode();
        if (mixerNode) rebuildMixerActions(mixerNode);
        renderAnimationEditor();
        state.selectedKeyframe = null;
        renderInspector();
      };
      window.createAnimResourceForMixer = function (nodeId) {
        const node = findNode(nodeId);
        if (!node) return;
        const res = addRes(
          new Resource("animation", "NewAnimation_" + (RES_ID + 1), null, {
            clips: [],
          }),
        );
        node.refs.animation = res.id;
        state.currentSceneResources.add(res.id);
        renderInspector();
      };
      window.addEmptyClipToAnim = function (animId) {
        const animRes = getRes(animId);
        if (!animRes) return;
        const clip = new THREE.AnimationClip(
          "Clip_" + (animRes.clips.length + 1),
          1.0,
          [],
        );
        const clipRes = addRes(new Resource("animation_clip", clip.name, clip));
        animRes.clips.push(clipRes.id);
        state.currentSceneResources.add(clipRes.id);
        renderInspector();
        renderAnimationEditor();
      };
      window.resetOverride = function (nodeId, resId, prop) {
        const node = findNode(nodeId);
        if (!node || !node.overrides || !node.overrides[resId]) return;
        delete node.overrides[resId][prop];
        if (Object.keys(node.overrides[resId]).length === 0)
          delete node.overrides[resId];
        sync3DScene();
        renderInspector();
      };
      function getValWithOverride(res, prop, contextNode) {
        if (
          contextNode &&
          contextNode.overrides &&
          contextNode.overrides[res.id] &&
          contextNode.overrides[res.id][prop] !== undefined
        ) {
          return contextNode.overrides[res.id][prop];
        }
        return res.refs[prop] !== undefined ? res.refs[prop] : res.data[prop];
      }

      function renderResourceBody(res, contextNode) {
        if (res.type === "prefab" || res.type === "scene")
          return renderPrefabBody(res);
        let html = "";
        if (res.type === "mesh") {
          html += `<div class="insp-group" style="margin-top:0;border-top:none;">Surfaces</div>`;
          html += renderResourceSlot(
            res,
            "material",
            ["material"],
            "Material",
            contextNode,
          );
        } else if (res.type === "material") {
          const isOv = contextNode && isAssetVisible(res);
          const renderRow = (label, prop, inputHtml) => {
            const hasOv =
              isOv &&
              contextNode.overrides[res.id] &&
              contextNode.overrides[res.id][prop] !== undefined;
            return `<div class="insp-row"><label>${label}</label>${inputHtml}${hasOv ? `<button class="reset-btn" onclick="resetOverride('${contextNode.id}', '${res.id}', '${prop}')" title="Сбросить">↺</button>` : ""}</div>`;
          };
          const albedoId = res.id + "_albedo";
          html += `<div class="prop-section ${collapsedSections.has(albedoId) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${albedoId}')"><span class="arrow">▶</span> Albedo</div>`;
          html += `<div class="prop-section-body">`;
          const colVal = getValWithOverride(res, "color", contextNode);
          html += renderRow(
            "Color",
            "color",
            `<input type="color" value="${typeof colVal === "string" ? colVal : "#" + res.data.color.getHexString()}" data-mat-id="${res.id}" data-mat-prop="color">`,
          );
          html += renderResourceSlot(
            res,
            "albedo",
            ["texture"],
            "Texture",
            contextNode,
          );
          html += `</div></div>`;
          const metalId = res.id + "_metal";
          html += `<div class="prop-section ${collapsedSections.has(metalId) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${metalId}')"><span class="arrow">▶</span> Metallic / Roughness</div>`;
          html += `<div class="prop-section-body">`;
          const metVal = getValWithOverride(res, "metalness", contextNode);
          html += renderRow(
            "Metallic",
            "metalness",
            `<input type="range" min="0" max="1" step="0.01" value="${metVal}" data-mat-id="${res.id}" data-mat-prop="metalness"><span class="val">${Number(metVal).toFixed(2)}</span>`,
          );
          const rouVal = getValWithOverride(res, "roughness", contextNode);
          html += renderRow(
            "Rough",
            "roughness",
            `<input type="range" min="0" max="1" step="0.01" value="${rouVal}" data-mat-id="${res.id}" data-mat-prop="roughness"><span class="val">${Number(rouVal).toFixed(2)}</span>`,
          );
          html += `</div></div>`;
          const normalId = res.id + "_normal";
          html += `<div class="prop-section ${collapsedSections.has(normalId) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${normalId}')"><span class="arrow">▶</span> Normal</div>`;
          html += `<div class="prop-section-body">`;
          html += renderResourceSlot(
            res,
            "normal",
            ["texture"],
            "Texture",
            contextNode,
          );
          html += `</div></div>`;
        } else if (res.type === "texture") {
          const tex = res.data;
          const u = texURL(tex);
          const dim = tex.image
            ? `${tex.image.width}×${tex.image.height}`
            : "?";
          html += `<div class="insp-row"><label>Size</label><span style="color:#8a8a8a;font-family:Consolas;font-size:10px">${dim}</span></div>`;
          if (u)
            html += `<div style="padding:4px"><img src="${u}" class="tex-preview" draggable="false"></div>`;
          const fid = res.id + "_filt";
          html += `<div class="prop-section ${collapsedSections.has(fid) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${fid}')"><span class="arrow">▶</span> Filtering</div>`;
          html += `<div class="prop-section-body">`;
          html += `<div class="insp-row"><label>Min Filter</label>
      <select data-tex-id="${res.id}" data-tex-prop="minFilter" style="flex:1">
        <option value="1003" ${tex.minFilter === 1003 ? "selected" : ""}>Nearest</option>

        <option value="1008" ${tex.minFilter === 1008 ? "selected" : ""}>Linear Mipmap Linear</option>
      </select></div>`;
          html += `<div class="insp-row"><label>Mag Filter</label>
      <select data-tex-id="${res.id}" data-tex-prop="magFilter" style="flex:1">
        <option value="1003" ${tex.magFilter === 1003 ? "selected" : ""}>Nearest</option>
        <option value="1006" ${tex.magFilter === 1006 ? "selected" : ""}>Linear</option>
      </select></div>`;
          html += `</div></div>`;
          const wid = res.id + "_wrap";
          html += `<div class="prop-section ${collapsedSections.has(wid) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${wid}')"><span class="arrow">▶</span> Wrapping</div>`;
          html += `<div class="prop-section-body">`;
          html += `<div class="insp-row"><label>Wrap S</label>
      <select data-tex-id="${res.id}" data-tex-prop="wrapS" style="flex:1">
        <option value="1000" ${tex.wrapS === 1000 ? "selected" : ""}>Repeat</option>
        <option value="1001" ${tex.wrapS === 1001 ? "selected" : ""}>Clamp to Edge</option>
        <option value="1002" ${tex.wrapS === 1002 ? "selected" : ""}>Mirror</option>
      </select></div>`;
          html += `<div class="insp-row"><label>Wrap T</label>
      <select data-tex-id="${res.id}" data-tex-prop="wrapT" style="flex:1">
        <option value="1000" ${tex.wrapT === 1000 ? "selected" : ""}>Repeat</option>
        <option value="1001" ${tex.wrapT === 1001 ? "selected" : ""}>Clamp to Edge</option>
        <option value="1002" ${tex.wrapT === 1002 ? "selected" : ""}>Mirror</option>
      </select></div>`;
          html += `</div></div>`;
          const tid = res.id + "_tf";
          html += `<div class="prop-section ${collapsedSections.has(tid) ? "" : "expanded"}">`;
          html += `<div class="prop-section-header" onclick="toggleSection('${tid}')"><span class="arrow">▶</span> Transform</div>`;
          html += `<div class="prop-section-body">`;
          html += `<div class="insp-row"><label>Repeat</label>
      <input type="number" step="0.1" value="${tex.repeat.x}" data-tex-id="${res.id}" data-tex-prop="repeatX" title="X">
      <input type="number" step="0.1" value="${tex.repeat.y}" data-tex-id="${res.id}" data-tex-prop="repeatY" title="Y">
    </div>`;
          html += `<div class="insp-row"><label>Offset</label>
      <input type="number" step="0.1" value="${tex.offset.x}" data-tex-id="${res.id}" data-tex-prop="offsetX" title="X">

    </div>`;
          html += `<div class="insp-row"><label>Rotation°</label>
      <input type="number" step="5" value="${((tex.rotation * 180) / Math.PI).toFixed(0)}" data-tex-id="${res.id}" data-tex-prop="rotationDeg">
    </div>`;
          html += `<div class="insp-row"><label>Flip Y</label>
      <input type="checkbox" ${tex.flipY ? "checked" : ""} data-tex-id="${res.id}" data-tex-prop="flipY">
    </div>`;
          html += `</div></div>`;
        } else if (res.type === "animation") {

          html += `<div class="insp-group" style="margin-top:0;border-top:none;">Animation Clips (${res.clips.length})</div>`;
          res.clips.forEach((clipId, i) => {
